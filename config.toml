[server]
# Environment variables:
#   NANOFILE_SERVER_ADDR
#   NANOFILE_SERVER_PORT
#   NANOFILE_SERVER_VERSION
#   NANOFILE_SERVER_SITE_URL
#   NANOFILE_SERVER_MAX_UPLOAD_SIZE_MB
#   NANOFILE_SERVER_MAX_CHUNK_SIZE_MB
#   NANOFILE_SERVER_REQUEST_TIMEOUT_SECS
#   NANOFILE_CORS_ALLOWED_ORIGINS           (comma-separated)
#   NANOFILE_CORS_MAX_AGE_SECS
#   NANOFILE_SERVER_WEBDAV_ENABLED
#   NANOFILE_SERVER_SSO_ENABLED
#   NANOFILE_SERVER_FILE_SEARCH_ENABLED
#   NANOFILE_SERVER_DESKTOP_CUSTOM_BRAND
#   NANOFILE_SERVER_DESKTOP_CUSTOM_LOGO
#   NANOFILE_SERVER_ENCRYPTED_LIBRARY_PWD_HASH_ALGO
#   NANOFILE_SERVER_ENCRYPTED_LIBRARY_PWD_HASH_PARAMS
#   NANOFILE_SERVER_TRAY
addr = "0.0.0.0"
# Seafile-compatible version advertised to clients via /api2/server-info/.
# Clients parse the major/minor/patch numbers to gate feature availability.
version = "8.0.0"
port = 8082
# External URL used for download links and CORS defaults.
# IMPORTANT: download links are built from this address (like seahub's
# FILE_SERVER_ROOT), so when clients reach this server through a reverse
# proxy / TLS terminator, set it to the address clients actually use,
# e.g. "https://your-domain.com". Otherwise the port gets appended to the
# request Host, and downloads may hang on clients.
site_url = "http://127.0.0.1:8082"
max_upload_size_mb = 4096
# Per-chunk cap for resumable (Content-Range) uploads. Enforced before the chunk
# body is read: an oversized chunk is rejected from the header alone, and the
# bytes actually read are also capped, so one request can never buffer more than
# this amount (0 disables the cap).
max_chunk_size_mb = 256
request_timeout_secs = 600
cors_allowed_origins = []
cors_max_age_secs = 86400
webdav_enabled = true
# SSO local-browser login flow (client-sso-via-local-browser feature).
sso_enabled = true
# Advertise the `file-search` feature (gates the desktop client's search tab
# and mobile search). The backend has a search API either way.
file_search_enabled = true
# Optional desktop-client customization — only advertised in /api2/server-info/
# when set:
# desktop_custom_brand = "My Company"
# desktop_custom_logo = "custom/logo.png"   # relative to server root; the client joins it onto the server URL
# Optional encrypted-library password-hash config — only advertised in
# /api2/server-info/ when set (used when clients create encrypted libraries):
# encrypted_library_pwd_hash_algo = "PBKDF2"
# encrypted_library_pwd_hash_params = "iterations=1000"
# IPs of trusted reverse proxies (comma-separated). X-Forwarded-For is only
# honored for rate limiting when the TCP peer is one of these. Keep empty when
# the server is exposed directly.
trusted_proxies = []
# System tray icon (only exists in binaries built with `--features tray`;
# plain builds have no tray code at all). Set to false (or NANOFILE_SERVER_TRAY=false)
# to run headless even in a desktop session — e.g. for an auto-started instance
# that should stay invisible.
tray = true
#   NANOFILE_SERVER_SECRET_KEY               (generate with: openssl rand -hex 32)
# IMPORTANT: Generate a unique secret key for production:
#   openssl rand -hex 32
secret_key = ""
# ^ Set to empty string to auto-generate on startup.
#   This is the single master key. The notification private key and
#   CSRF signing key are derived from it automatically.
#   For production, set NANOFILE_SERVER_SECRET_KEY to persist across restarts.

[database]
# Environment variables:
#   NANOFILE_DATABASE_URL
#   NANOFILE_DATABASE_MAX_CONNECTIONS
url = "sqlite:data/nanofile.db?mode=rwc"
# Pooled SQLite connections. WAL allows concurrent readers (single writer), so
# this mainly improves read throughput. Kept modest because `mmap_size` and
# `cache_size` are per-connection overhead.
max_connections = 5

[storage]
# Environment variables:
#   NANOFILE_STORAGE_BLOCK_DIR
#   NANOFILE_STORAGE_TEMP_DIR
#   NANOFILE_STORAGE_THUMBNAIL_DIR
#   NANOFILE_STORAGE_AVATAR_DIR
#   NANOFILE_STORAGE_MAX_STORAGE_BYTES
#   NANOFILE_STORAGE_FFMPEG_PATH
#   NANOFILE_STORAGE_MAX_TEMP_UPLOADS
#   NANOFILE_STORAGE_MAX_TEMP_UPLOAD_BYTES
#   NANOFILE_STORAGE_TEMP_UPLOAD_TTL_HOURS
#   NANOFILE_STORAGE_MAX_ZIP_ENTRIES
#   NANOFILE_STORAGE_MAX_ZIP_BYTES
#   NANOFILE_STORAGE_BLOCK_ENCRYPTION_MODE
#   NANOFILE_STORAGE_ENCRYPTION_KEY        (discouraged: visible in process listings)
#   NANOFILE_STORAGE_ENCRYPTION_KEY_FILE   (read key from file, safer)
block_dir = "data/blocks"
temp_dir = "data/temp"
# Thumbnail cache directory.
thumbnail_dir = "data/thumbnails"
# Avatar storage directory.
avatar_dir = "data/avatars"
max_storage_bytes = 0
# ffmpeg binary used to generate video thumbnails. Video files keep showing a
# play-icon placeholder when this binary isn't installed. Playback works without it.
ffmpeg_path = "ffmpeg"
# Max concurrent in-flight resumable (Content-Range) uploads tracked by the temp
# manager (0 = unlimited). Prevents abandoned chunked uploads from exhausting memory.
max_temp_uploads = 1000
# Max total declared bytes across active temp uploads (0 = unlimited).
max_temp_upload_bytes = 0
# Hours an abandoned resumable-upload temp file is retained before cleanup (0 = disable).
temp_upload_ttl_hours = 24
# Max files in a single zip archive download (0 = unlimited).
max_zip_entries = 10000
# Max total uncompressed bytes in a single zip archive (0 = unlimited).
max_zip_bytes = 0
# Server-side transparent at-rest encryption for file blocks:
#   "off"  - blocks are stored exactly as received (legacy plaintext).
#   "on"   - every new write is encrypted, every read is decrypted; requires encryption_key.
#   "lazy" - new writes are encrypted, reads accept both encrypted and legacy plaintext
#            blocks — the migration window.
# The block id (sha1 of logical bytes) is unchanged in every mode, so Seafile clients
# and the existing content-addressed dedup keep working.
block_encryption_mode = "off"
# Master key for block at-rest encryption. When block_encryption_mode is not "off" and
# this is unset, it's auto-derived from [server] secret_key. Set explicitly via
# NANOFILE_STORAGE_ENCRYPTION_KEY_FILE for a dedicated key.
# encryption_key = ...

[auth]
# Environment variables:
#   NANOFILE_AUTH_PASSWORD_HASH_ITERATIONS
#   NANOFILE_AUTH_API_TOKEN_TTL_DAYS
#   NANOFILE_AUTH_SYNC_TOKEN_TTL_DAYS
#   NANOFILE_AUTH_MAX_LOGIN_ATTEMPTS
#   NANOFILE_AUTH_LOCKOUT_DURATION_SECS
#   NANOFILE_AUTH_ENABLE_INVITATIONS
#   NANOFILE_AUTH_ENABLE_PASSWORD_RESET
#   NANOFILE_AUTH_PASSWORD_MIN_LENGTH
#   NANOFILE_AUTH_REQUIRE_STRONG_PASSWORD
password_hash_iterations = 600000
api_token_ttl_days = 180
sync_token_ttl_days = 365
max_login_attempts = 5
lockout_duration_secs = 900
enable_invitations = true
enable_password_reset = true
password_min_length = 8
require_strong_password = false
# Max password reset requests per IP per hour (0 = unlimited)
password_reset_max_per_hour = 5
# Max registration attempts per IP per hour (0 = unlimited)
registration_max_per_hour = 5
# Max TOTP verification attempts per user per 5 minutes (0 = unlimited)
totp_max_attempts = 5
# Max password attempts for password-protected share/upload links per IP per hour (0 = unlimited)
link_password_max_per_hour = 5
# Max anonymous share-link downloads per IP per minute (0 = unlimited)
share_download_max_per_minute = 30

[ui]
# Environment variables:
#   NANOFILE_UI_DEFAULT_LANGUAGE
#   NANOFILE_UI_TRAY_LANGUAGE
# Fallback UI language when the user hasn't set a preference and the browser's
# Accept-Language doesn't match a supported language. Supported: "en", "zh".
default_language = "en"
# Language of the system tray menu (desktop builds): "auto" follows the OS
# locale (falling back to default_language), "en"/"zh" force a language.
tray_language = "auto"

[email]
# Environment variables:
#   NANOFILE_EMAIL_ENABLED
# Password reset links are ONLY delivered to the account owner's email inbox.
# Without an email backend configured, the password-reset flow is disabled and
# the server never returns a reset link (echoing it back would allow account
# takeover). Set to true only once an SMTP backend is wired up.
enabled = false

[admin_init]
# Environment variables:
#   NANOFILE_ADMIN_INIT_EMAIL
#   NANOFILE_ADMIN_INIT_PASSWORD
#   NANOFILE_ADMIN_INIT_PASSWORD_FILE   (read password from a file, safer)
# email = "admin@example.com"
# password = "secret123"

[logging]
# Environment variables:
#   NANOFILE_LOG_LEVEL
#   NANOFILE_LOG_FILE_ENABLED
#   NANOFILE_LOG_FILE
# Log level: "trace"/"debug"/"info"/"warn"/"error" (or an EnvFilter expression).
level = "info"
# Send logs to a size-capped, rotating file instead of stdout. Unset = auto:
# desktop (tray) runs log to a file, headless runs (servers, Docker) log to
# stdout. Set true/false to force either.
#file_enabled = true
# Log file path. Unset: resolved to "nanofile.log" next to the nanofile binary
# in file-logging mode and written back here (absolute path), so a
# login-started instance always uses the same file. A relative path resolves
# against the binary's directory, never the working directory.
#file = "nanofile.log"
# Per-file size cap (MB) before rotation; at most max_backups older files
# (nanofile.log.1, nanofile.log.2, ...) are kept. max_backups = 0 truncates
# the log in place instead of keeping backups.
max_file_size_mb = 10
max_backups = 3

[gc]
# Environment variables:
#   NANOFILE_GC_ENABLED
#   NANOFILE_GC_INTERVAL_HOURS
enabled = false
interval_hours = 24

[tasks]
# Environment variables:
#   NANOFILE_TASKS_MAX_ACTIVE
# Max async copy/move tasks in Pending or Processing state (0 = unlimited).
# New tasks beyond the cap are rejected with HTTP 429, preventing authenticated
# users from exhausting the server with unbounded background copy tasks.
max_active_tasks = 100

[index]
# Environment variables:
#   NANOFILE_INDEX_ENABLED
#   NANOFILE_INDEX_INDEX_DIR
enabled = true
index_dir = "data/index"

[notification]
# Environment variables:
#   NANOFILE_NOTIFICATION_ENABLED
#   NANOFILE_NOTIFICATION_PRIVATE_KEY
#   NANOFILE_NOTIFICATION_PING_INTERVAL
#   NANOFILE_NOTIFICATION_CLIENT_TIMEOUT
#   NANOFILE_NOTIFICATION_MAX_CONNECTIONS
#   NANOFILE_NOTIFICATION_MAX_CONNECTIONS_PER_IP
#   NANOFILE_NOTIFICATION_SUBSCRIBE_TIMEOUT_SECS
enabled = true
private_key = ""
# ^ When empty, derived from [server] secret_key automatically.
#   Set explicitly if you need a different key for notification JWTs
#   (e.g., when notification events are posted by external services).
# Seconds between WebSocket Ping frames (0 = disable keepalive).
ping_interval = 30
# Seconds without a Pong after which the connection is dropped.
client_timeout = 90
# Max concurrent WebSocket connections (0 = unlimited). Prevents connection-exhaustion DoS.
max_connections = 1024
# Max concurrent WebSocket connections per client IP (0 = unlimited).
max_connections_per_ip = 64
# Seconds a connection may stay unauthenticated before the server drops it (0 = disabled).
subscribe_timeout_secs = 60
