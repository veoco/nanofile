[server]
# Environment variables:
#   NANOFILE_SERVER_ADDR
#   NANOFILE_SERVER_PORT
#   NANOFILE_SERVER_VERSION
#   NANOFILE_SERVER_SITE_URL
#   NANOFILE_SERVER_MAX_UPLOAD_SIZE_MB
#   NANOFILE_SERVER_REQUEST_TIMEOUT_SECS
#   NANOFILE_CORS_ALLOWED_ORIGINS           (comma-separated)
#   NANOFILE_CORS_MAX_AGE_SECS
#   NANOFILE_SERVER_WEBDAV_ENABLED
#   NANOFILE_SERVER_SSO_ENABLED
#   NANOFILE_SERVER_FILE_SEARCH_ENABLED
#   NANOFILE_SERVER_WIKI_ENABLED
#   NANOFILE_SERVER_DESKTOP_CUSTOM_BRAND
#   NANOFILE_SERVER_DESKTOP_CUSTOM_LOGO
#   NANOFILE_SERVER_ENCRYPTED_LIBRARY_PWD_HASH_ALGO
#   NANOFILE_SERVER_ENCRYPTED_LIBRARY_PWD_HASH_PARAMS
addr = "0.0.0.0"
# Seafile-compatible version advertised to clients via /api2/server-info/.
# Clients parse the major/minor/patch numbers to gate feature availability.
version = "8.0.0"
port = 8082
# External URL used for download links and CORS defaults.
# IMPORTANT: download links are built from this address (like seahub's
# FILE_SERVER_ROOT), so when clients reach this server through a reverse
# proxy / TLS terminator, set it to the address clients actually use,
# e.g. "https://your-domain.com". Otherwise the port gets appended to the
# request Host, and downloads may hang on clients.
site_url = "http://127.0.0.1:8082"
max_upload_size_mb = 4096
request_timeout_secs = 600
cors_allowed_origins = []
cors_max_age_secs = 86400
webdav_enabled = true
# SSO local-browser login flow (client-sso-via-local-browser feature).
sso_enabled = true
# Advertise the `file-search` feature (gates the desktop client's search tab
# and mobile search). The backend has a search API either way.
file_search_enabled = true
# Advertise the `wiki` feature (gates the mobile wiki tab; mirrors seahub's
# ENABLE_WIKI).
wiki_enabled = true
# Optional desktop-client customization — only advertised in /api2/server-info/
# when set:
# desktop_custom_brand = "My Company"
# desktop_custom_logo = "custom/logo.png"   # relative to server root; the client joins it onto the server URL
# Optional encrypted-library password-hash config — only advertised in
# /api2/server-info/ when set (used when clients create encrypted libraries):
# encrypted_library_pwd_hash_algo = "PBKDF2"
# encrypted_library_pwd_hash_params = "iterations=1000"
# IPs of trusted reverse proxies (comma-separated). X-Forwarded-For is only
# honored for rate limiting when the TCP peer is one of these. Keep empty when
# the server is exposed directly.
trusted_proxies = []
#   NANOFILE_SERVER_SECRET_KEY               (generate with: openssl rand -hex 32)
# IMPORTANT: Generate a unique secret key for production:
#   openssl rand -hex 32
secret_key = ""
# ^ Set to empty string to auto-generate on startup.
#   This is the single master key. The notification private key and
#   CSRF signing key are derived from it automatically.
#   For production, set NANOFILE_SERVER_SECRET_KEY to persist across restarts.

[database]
# Environment variables:
#   NANOFILE_DATABASE_URL
url = "sqlite:data/nanofile.db?mode=rwc"

[storage]
# Environment variables:
#   NANOFILE_STORAGE_BLOCK_DIR
#   NANOFILE_STORAGE_TEMP_DIR
#   NANOFILE_STORAGE_MAX_STORAGE_BYTES
#   NANOFILE_STORAGE_FFMPEG_PATH
block_dir = "data/blocks"
temp_dir = "data/temp"
max_storage_bytes = 0
# ffmpeg binary used to generate video thumbnails. Video files keep showing a
# play-icon placeholder when this binary isn't installed. Playback works without it.
ffmpeg_path = "ffmpeg"

[auth]
# Environment variables:
#   NANOFILE_AUTH_PASSWORD_HASH_ITERATIONS
#   NANOFILE_AUTH_API_TOKEN_TTL_DAYS
#   NANOFILE_AUTH_SYNC_TOKEN_TTL_DAYS
#   NANOFILE_AUTH_MAX_LOGIN_ATTEMPTS
#   NANOFILE_AUTH_LOCKOUT_DURATION_SECS
#   NANOFILE_AUTH_ENABLE_INVITATIONS
#   NANOFILE_AUTH_ENABLE_PASSWORD_RESET
#   NANOFILE_AUTH_PASSWORD_MIN_LENGTH
#   NANOFILE_AUTH_REQUIRE_STRONG_PASSWORD
password_hash_iterations = 600000
api_token_ttl_days = 180
sync_token_ttl_days = 365
max_login_attempts = 5
lockout_duration_secs = 900
enable_invitations = true
enable_password_reset = true
password_min_length = 8
require_strong_password = false
# Max password reset requests per IP per hour (0 = unlimited)
password_reset_max_per_hour = 5
# Max registration attempts per IP per hour (0 = unlimited)
registration_max_per_hour = 5
# Max TOTP verification attempts per user per 5 minutes (0 = unlimited)
totp_max_attempts = 5

[ui]
# Environment variables:
#   NANOFILE_UI_DEFAULT_LANGUAGE
# Fallback UI language when the user hasn't set a preference and the browser's
# Accept-Language doesn't match a supported language. Supported: "en", "zh".
default_language = "en"

[email]
# Environment variables:
#   NANOFILE_EMAIL_ENABLED
# Password reset links are ONLY delivered to the account owner's email inbox.
# Without an email backend configured, the password-reset flow is disabled and
# the server never returns a reset link (echoing it back would allow account
# takeover). Set to true only once an SMTP backend is wired up.
enabled = false

[admin_init]
# Environment variables:
#   NANOFILE_ADMIN_INIT_EMAIL
#   NANOFILE_ADMIN_INIT_PASSWORD
#   NANOFILE_ADMIN_INIT_PASSWORD_FILE   (read password from a file, safer)
# email = "admin@example.com"
# password = "secret123"

[logging]
# Environment variables:
#   NANOFILE_LOG_LEVEL
level = "info"

[gc]
# Environment variables:
#   NANOFILE_GC_ENABLED
#   NANOFILE_GC_INTERVAL_HOURS
enabled = false
interval_hours = 24

[index]
# Environment variables:
#   NANOFILE_INDEX_ENABLED
#   NANOFILE_INDEX_INDEX_DIR
enabled = true
index_dir = "data/index"

[notification]
# Environment variables:
#   NANOFILE_NOTIFICATION_ENABLED
enabled = true
private_key = ""
# ^ When empty, derived from [server] secret_key automatically.
#   Set explicitly if you need a different key for notification JWTs
#   (e.g., when notification events are posted by external services).
ping_interval = 30
client_timeout = 90
