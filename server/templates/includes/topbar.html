{% import "includes/icons.html" as icons %}
<header class="shrink-0 flex items-center gap-4 h-14 px-4 bg-panel border-b border-line">
    <!-- Mobile menu button + Logo (left side) -->
    <div class="flex items-center gap-2 flex-shrink-0">
        <button type="button" class="js-mobile-menu-toggle iconbtn -ml-2 lg:hidden"
                aria-label="{{ t.tr("a11y.toggle_sidebar") }}">
            {{ icons::icon_menu("h-5 w-5") }}
        </button>
        <a href="/libraries/" class="flex items-center gap-2.5 no-underline text-ink flex-shrink-0"
           aria-label="{{ t.tr("app.name") }}">
            {{ icons::icon_brand_mark("h-[26px] w-[26px] shrink-0") }}
            <span class="hidden sm:inline text-[14px] font-semibold tracking-[-0.01em]">Nanofile</span>
        </a>
    </div>

    <!-- Search (flex-1, stays center-ish) -->
    <div class="flex-1 max-w-[420px] mx-2 lg:mx-6">
        <label class="nf-search w-full">
            {{ icons::icon_search("w-3.5 h-3.5 flex-shrink-0") }}
            <input type="search" class="js-quick-search" placeholder="{{ t.tr("search.placeholder") }}"
                   aria-label="{{ t.tr("search.placeholder") }}">
            <kbd class="hidden sm:inline">/</kbd>
        </label>
    </div>

    <!-- Right-aligned actions -->
    <div class="flex items-center gap-0.5 ml-auto">
        <!-- Settings -->
        <a href="/settings/"
           class="iconbtn no-underline"
           title="{{ t.tr("nav.settings") }}" aria-label="{{ t.tr("nav.settings") }}">
            {{ icons::icon_cog("h-4 w-4") }}
        </a>

        <!-- Dark mode toggle -->
        <button type="button" class="js-dark-toggle iconbtn"
                aria-label="{{ t.tr("a11y.toggle_dark_mode") }}">
            {{ icons::icon_moon("h-4 w-4 block dark:hidden") }}
            {{ icons::icon_sun("h-4 w-4 hidden dark:block") }}
        </button>

        <!-- User menu dropdown -->
        <div class="relative js-user-menu ml-1" data-is-admin="{{ is_admin }}">
            <button type="button" class="js-user-menu-button flex items-center gap-x-2 h-8 pl-[3px] pr-2 rounded-full text-[12.5px] text-ink-2 hover:bg-raised transition-colors">
                <img src="/avatars/user/{{ user_email }}/resized/32/" alt=""
                     class="h-6 w-6 rounded-full object-cover bg-raised">
                <span class="hidden lg:block truncate max-w-[180px]">{{ user_email }}</span>
                {% if is_admin %}
                <span class="tag-admin">{{ t.tr("nav.admin") }}</span>
                {% endif %}
            </button>
        </div>
    </div>
</header>
