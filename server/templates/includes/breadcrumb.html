<nav class="crumbs" aria-label="{{ t.tr("a11y.breadcrumb") }}">
    <a href="/libraries/" class="flex-shrink-0">{{ t.tr("nav.libraries") }}</a>
    <span class="sep flex-shrink-0">/</span>
    <a href="/libraries/{{ repo_id }}/files/" class="flex-shrink-0 truncate max-w-[160px]">{{ repo_name }}</a>
    {% for crumb in breadcrumbs %}
    <span class="sep flex-shrink-0">/</span>
    {% if loop.last %}
    <span class="cur truncate max-w-[200px] sm:max-w-xs">{{ crumb.label }}</span>
    {% else %}
    <a href="/libraries/{{ repo_id }}/files/{{ crumb.path|urlencode }}" class="truncate max-w-[120px] sm:max-w-[200px]">{{ crumb.label }}</a>
    {% endif %}
    {% endfor %}
</nav>
