<!DOCTYPE html>
<html lang="{{ t.lang }}" class="h-full">
<head>
    <script src="{{ urls.theme_init_js }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nanofile{% endblock %}</title>
    <meta name="description" content="Nanofile - Seafile-compatible sync server">
    <link rel="icon" type="image/svg+xml" href="{{ urls.favicon }}">
    <link rel="stylesheet" href="{{ urls.css }}">
</head>
<body class="h-full bg-canvas text-ink">
<div class="flex min-h-full items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-panel border border-line px-8 py-10 rounded-box">
            <!-- Logo -->
            <div class="flex justify-center mb-6">
                <div class="h-11 w-11 rounded-box bg-accent flex items-center justify-center">
                    <span class="text-lg font-bold text-accent-ink">N</span>
                </div>
            </div>

            <!-- Heading -->
            {% block heading %}{% endblock %}

            <!-- Error alert (optional — set `error` in page template) -->
            {% block error %}{% endblock %}

            <!-- Page-specific form / content -->
            {% block content %}{% endblock %}
        </div>

        <!-- Footer links below card -->
        {% block footer %}{% endblock %}
    </div>
</div>
</body>
</html>
