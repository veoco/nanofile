{% import "includes/icons.html" as icons %}
<div class="file-list-container"
     data-drop-zone>
    {% include "includes/file_list.html" %}

    <!-- Drop zone overlay (shown during drag-over) -->
    <div class="drop-overlay hidden absolute inset-0 z-drop flex items-center justify-center rounded-lg border-2 border-dashed border-brand-500 bg-brand-50/90 dark:bg-brand-500/10">
        <div class="text-center">
            {{ icons::icon_upload("mx-auto h-12 w-12 text-brand-500") }}
            <p class="mt-3 text-lg font-medium text-gray-700 dark:text-gray-300">{{ t.tr("fb.drop_files_here") }}</p>
            <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ t.tr("fb.will_upload_current_dir") }}</p>
        </div>
    </div>
</div>
