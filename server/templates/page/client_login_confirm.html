<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Client Login | Nanofile</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="h-full bg-surface-50 dark:bg-surface-900">
<div class="flex min-h-full items-center justify-center px-4">
    <div class="text-center">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Do you want to login to your client?</h1>
        <p class="mt-4 text-lg text-gray-500 dark:text-gray-400">Click "Yes" to authorize this device.</p>
        <form action="{{ action }}" method="POST" class="mt-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="inline-block rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600 transition-colors">Yes</button>
        </form>
    </div>
</div>
</body>
</html>
