[package]
name = "server"
version = "0.1.15"
edition = "2024"
description = "Nanofile server — Seafile-compatible sync server"
license = "MIT"

[features]
# System tray icon with a right-click menu (open Web UI, toggle auto-start,
# open config file, quit). The tray icon and the Windows exe icon are
# rasterized from static/img/favicon.svg at compile time (see build.rs), so no
# image assets ship in the repo. Linux additionally needs the system packages
# libgtk-3 and libayatana-appindicator3.
tray = [
    # default-features = false drops muda's `libxdo` (clipboard menu items we
    # do not use, which would add a libxdo system dependency); the Linux GTK
    # backend is re-enabled explicitly below.
    "dep:tray-icon",
    "tray-icon/gtk",
    "dep:open",
    "dep:notify-rust",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:gtk",
    "dep:resvg",
    "dep:tiny-skia",
    "dep:winresource",
    # OS locale detection for the tray menu language (tray.quit etc.).
    "dep:sys-locale",
]

[dependencies]
base = { path = "../base", features = ["with-axum"] }
infra = { path = "../infra" }
migration = { path = "../migration" }

async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "limit", "normalize-path", "timeout"] }
# The HTTP server is driven directly (not via `axum::serve`) so hyper-level
# timeouts can be configured; see `serve_with_timeouts` in `main.rs`.
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "server",
    "server-auto",
    "service",
    "tokio",
] }
tower = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
async_zip = { version = "0.0", features = ["tokio", "deflate"] }
futures-util = "0.3"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"

sea-orm = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "serde",
] }
sea-orm-migration = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
quick-xml = { version = "0.42", features = ["serialize"] }

# Outbound email (settings, notifications, password reset). Rustls rather than
# native-tls so the binary keeps its "no OpenSSL" property; `hostname` is off
# because the EHLO name is taken from the configured site URL rather than the
# machine, and the file transport is a test-only backend that would otherwise
# put reset links on disk.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls-tls",
    "tracing",
] }

rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"
cipher = { version = "0.5", features = ["block-padding", "alloc"] }
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
subtle = "2"
hex = "0.4"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
kamadak-exif = "0.6"
percent-encoding = "2.3"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
askama = { version = "0.16", features = ["serde_json", "urlencode"] }
rust-embed = "8"
serde_urlencoded = "0.7"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
multer = "3.1"

# Full-text search
tantivy = "0.26.1"
tantivy-jieba = "0.20.0"

# Document text extraction for the full-text index. Both are pure Rust (no
# pdfium, no C/C++), so the "no system library" property holds. Neither drags
# in a layout engine or a font stack: PDF text comes from `pdf-extract`, a thin
# text layer over `lopdf`, and Office text from `office_oxide`.
# `indexer::extract` holds the format table and the limits that keep these
# crates safe on untrusted content.
pdf-extract = "0.12"
office_oxide = "0.1.12"

# ── Optional system tray dependencies (enabled by the `tray` feature) ───────
# NOTE: keep these target-specific tables LAST — everything after a
# `[target.*.dependencies]` header belongs to that target only.
tray-icon = { version = "0.24", optional = true, default-features = false }
open = { version = "5", optional = true }
# OS locale detection (zero transitive dependencies) for the tray language.
sys-locale = { version = "0.3", optional = true }
# Startup notification: Windows toast / Linux org.freedesktop.Notifications.
# macOS is excluded — an unsigned, non-bundled CLI binary cannot reliably post
# notifications there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = { version = "4", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
# Not optional: the login entry (`HKCU\…\Run`) is read and written by every
# Windows build, not only the tray one — `nanofile service install` retires it,
# so the service and the login entry can never both start Nanofile.
winreg = "0.55"
# Not optional: `nanofile service …` (the Service Control Manager front-end the
# tray menu drives) exists in every Windows build, not only the tray one.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # ShellExecuteExW with the "runas" verb: the elevated install/uninstall.
    "Win32_UI_Shell",
    "Win32_Security",
    # CoInitializeEx for the shell call above.
    "Win32_System_Com",
    "Win32_System_Threading",
    # The Service Control Manager: install, uninstall, status and the service
    # control loop (`StartServiceCtrlDispatcherW`, `SetServiceStatus`, …).
    "Win32_System_Services",
    # `HKLM\SYSTEM\CurrentControlSet\Services\<name>\ImagePath`, which says
    # whether the registered service belongs to *this* installation.
    "Win32_System_Registry",
    # GUI-subsystem builds: reattach the parent console for CLI subcommands.
    "Win32_System_Console",
    # `GetDriveTypeW`/`SearchPathW` for the preflight, and the `DRIVE_*` values
    # it compares against (the SDK keeps those in WindowsProgramming).
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    # SID resolution for the access the service account needs, and the LSA call
    # that grants a named account "Log on as a service".
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
# NSApplication: sharedApplication/run; NSResponder gates sharedApplication;
# NSRunningApplication provides NSApplicationActivationPolicy::Accessory.
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "form"] }
image = { version = "0.25", features = ["tiff"] }
tempfile = "3"
tokio-tungstenite = "0.29"
zip = "2"
# `test-util` gives the task-system tests a paused clock (`start_paused`), so a
# timeout policy is exercised deterministically instead of by sleeping. It is a
# dev-dependency on purpose: `full` does not include it, and the production
# build must not pay for it.
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "nanofile"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.11"
# Tray feature build-time dependencies: rasterize static/img/favicon.svg into
# the tray icon RGBA (all platforms) and the Windows exe icon (via winresource).
# The mark is a path, not text, so the text / system-fonts features are off: the
# raster cannot change with the fonts installed on the build machine.
resvg = { version = "0.45", optional = true, default-features = false }
tiny-skia = { version = "0.11", optional = true }
winresource = { version = "0.1", optional = true }