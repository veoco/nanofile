[package]
name = "server"
version = "0.1.12"
edition = "2024"
description = "Nanofile server — Seafile-compatible sync server"
license = "MIT"

[features]
# System tray icon with a right-click menu (open Web UI, toggle auto-start,
# open config file, quit). The tray icon and the Windows exe icon are
# rasterized from static/img/favicon.svg at compile time (see build.rs), so no
# image assets ship in the repo. Linux additionally needs the system packages
# libgtk-3 and libayatana-appindicator3.
tray = [
    # default-features = false drops muda's `libxdo` (clipboard menu items we
    # do not use, which would add a libxdo system dependency); the Linux GTK
    # backend is re-enabled explicitly below.
    "dep:tray-icon",
    "tray-icon/gtk",
    "dep:open",
    "dep:notify-rust",
    "dep:winreg",
    "dep:windows-sys",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:gtk",
    "dep:resvg",
    "dep:tiny-skia",
    "dep:winresource",
    # OS locale detection for the tray menu language (tray.quit etc.).
    "dep:sys-locale",
]

[dependencies]
base = { path = "../base", features = ["with-axum"] }
infra = { path = "../infra" }
migration = { path = "../migration" }

async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "limit", "normalize-path", "timeout"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
async_zip = { version = "0.0", features = ["tokio", "deflate"] }
futures-util = "0.3"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"

sea-orm = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-uuid",
    "serde",
] }
sea-orm-migration = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
quick-xml = { version = "0.42", features = ["serialize"] }

rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
aes = "0.9"
cbc = "0.2"
cipher = { version = "0.5", features = ["block-padding", "alloc"] }
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
subtle = "2"
hex = "0.4"
base64 = "0.23"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
kamadak-exif = "0.6"
percent-encoding = "2.3"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
askama = { version = "0.16", features = ["serde_json", "urlencode"] }
rust-embed = "8"
serde_urlencoded = "0.7"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
multer = "3.1"

# Full-text search
tantivy = "0.26.1"
tantivy-jieba = "0.20.0"

# ── Optional system tray dependencies (enabled by the `tray` feature) ───────
# NOTE: keep these target-specific tables LAST — everything after a
# `[target.*.dependencies]` header belongs to that target only.
tray-icon = { version = "0.24", optional = true, default-features = false }
open = { version = "5", optional = true }
# OS locale detection (zero transitive dependencies) for the tray language.
sys-locale = { version = "0.3", optional = true }
# Startup notification: Windows toast / Linux org.freedesktop.Notifications.
# macOS is excluded — an unsigned, non-bundled CLI binary cannot reliably post
# notifications there.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = { version = "4", optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
winreg = { version = "0.55", optional = true }
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Threading",
    # GUI-subsystem builds: reattach the parent console for CLI subcommands.
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
# NSApplication: sharedApplication/run; NSResponder gates sharedApplication;
# NSRunningApplication provides NSApplicationActivationPolicy::Accessory.
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
] }
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "form"] }
image = { version = "0.25", features = ["tiff"] }
tempfile = "3"
tokio-tungstenite = "0.29"
zip = "2"

[[bin]]
name = "nanofile"
path = "src/main.rs"

[build-dependencies]
sha2 = "0.11"
# Tray feature build-time dependencies: rasterize static/img/favicon.svg into
# the tray icon RGBA (all platforms) and the Windows exe icon (via winresource).
resvg = { version = "0.45", optional = true, default-features = false, features = [
    "text",
    "system-fonts",
] }
tiny-skia = { version = "0.11", optional = true }
winresource = { version = "0.1", optional = true }