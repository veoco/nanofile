<p style="margin:0;font-size:13px;line-height:1.7;color:#71717a;">如果不是您本人操作，请立即在 {site_url} 的"设置 → API 密钥"里吊销它并修改密码。</p>'''
email.api_key_created.text = '''
{name}，您好：

