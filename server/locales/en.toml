tray.elevated_body = "Nanofile is running with administrator privileges.\n\n\"Start at login\" will be registered for the account \"{user}\", and will start at login without administrator rights.\n\nContinue?"
tray.service_confirm_enable = "Nanofile will be registered as a Windows service, running as {account}, and will start when Windows starts, without anyone logging in.\n\nAdministrator rights are required for the next step.\n\n- The \"Start at login\" entry is removed, so only one copy runs.\n- {account} is granted write access to the data directories, which it needs to serve.\n- This takes effect at the next system start; the copy running now keeps serving until then.\n\nConfig file: {config}\n\nContinue?"
tray.service_confirm_replace_missing = "The Windows service \"Nanofile\" is registered for a location that no longer exists:\n\n{existing}\n\nThe folder was probably moved or renamed. It will be repointed at this installation, re-registered to run as {account}, and will start when Windows starts, without anyone logging in.\n\nAdministrator rights are required for the next step.\n\n- The \"Start at login\" entry is removed, so only one copy runs.\n- {account} is granted write access to the data directories, which it needs to serve.\n- This takes effect at the next system start; the copy running now keeps serving until then.\n\nConfig file: {config}\n\nContinue?"
tray.service_confirm_replace = "The Windows service \"Nanofile\" is already registered for another installation:\n\n{existing}\n\nIt will be repointed at this installation, re-registered to run as {account}, and will start when Windows starts, without anyone logging in.\n\nAdministrator rights are required for the next step.\n\n- The \"Start at login\" entry is removed, so only one copy runs.\n- {account} is granted write access to the data directories, which it needs to serve.\n- This takes effect at the next system start; the copy running now keeps serving until then.\n\nConfig file: {config}\n\nContinue?"
tray.service_confirm_disable = "The Nanofile Windows service will be stopped and removed. Nanofile will not start automatically any more; enable \"Start at login\" in this menu if you want that instead.\n\nAdministrator rights are required for the next step. Continue?"
tray.service_confirm_disable_running = "The Nanofile Windows service is running and will be stopped and removed. Until Nanofile is started again (at the next login, or by running it), nothing will be serving.\n\nAdministrator rights are required. Continue?"
tray.service_installed = "Nanofile is registered as a Windows service, running as {account}. It starts at the next system start, without a login."
tray.service_removed = "The Nanofile Windows service has been removed: Nanofile no longer starts automatically, and nothing is serving until it is started again. Enable \"Start at login\" to start it at login, or run the executable now."
tray.service_failed = "The service could not be changed. The reason is in the log file (nanofile.log next to the executable)."
tray.service_launch_failed = "The administrator prompt could not be started."
tray.quit_service_stopped = "The Nanofile service was stopped. It starts again at the next system start."
