sandbox.note_fork = "Note: this platform has to allow fork, so the process bound is on starting programs rather than on copies of the worker."
sandbox.note_media_fork = "Note: the media worker starts the helper by copying itself, so its copies are bounded by the time limits rather than by the kernel."
sandbox.note_helper = "Note: the media worker is granted the configured helper and the loader the kernel needs to start it, and no other program."
sandbox.note_system_tree = "Note: the container can still read the system tree it loads from."
sandbox.note_writes = "Note: the container writes inside its own profile store."
sandbox.note_writes_user = "Note: a write from the container lands in the server user's own temporary directory, not in a redirected store — the container did not confine it."
sandbox.note_helper_libs = "Note: the media worker may read its helper, the loader that starts it, the libraries beside the helper and the system library directories. Nothing else is readable."
sandbox.note_helper_trees = "Note: the media worker may read its helper and, beyond the system libraries, the package-manager trees (/opt/homebrew, /usr/local, /opt/local) a packaged build links against."
sandbox.note_container_plain = "Note: this child was started with a weaker creation than this host can give — a restricted token without an AppContainer, or the server's own token. Nothing about file access is confined."
sandbox.note_container_no_token = "Note: this child runs in the container but without the restricted token: file access and the network are still confined, while the token's privileges were left in place."
sandbox.note_container_refused = "Note: the container the host would normally give was not applied. The parent's reason is in the raw report below as container_refused=."
sandbox.note_media_process = "Note: nothing on this platform bounds how many processes the media worker may create — the CPU limit is per process, and RLIMIT_NPROC counts per user. What bounds them is the parent's timeout and the process group it kills."
sandbox.note_lpac_off = "Note: the container could not opt out of ALL APPLICATION PACKAGES, so it inherits that package's grants on the system tree and on some per-user locations."
sandbox.note_metadata = "Note: the media worker can see which paths exist, though it cannot read them."
sandbox.note_ll_gaps = "Note: the seccomp filter is not installed, so Landlock's blind spots are unguarded."
sandbox.media_ok = "In the sandbox"
