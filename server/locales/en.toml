sandbox.media_below_min_reason = "The media worker starts a program by definition, so it never has the process item and grades below the minimum you set. Media thumbnails are not generated until that minimum is lowered."
sandbox.warning_disabled = "The sandbox is switched off: documents are not parsed for the search index, image and media thumbnails are not generated, EXIF is not read and avatars are not processed. Nothing is parsed inside the server process."
sandbox.warning_below_min = "This host grades below the minimum you set, so those features are disabled. Lower the minimum to run them with what this host gives."
sandbox.warning_incomplete = "Files are confined, so a parser cannot read the server user's files, but at least one further protection this platform can give is missing. Documents and images are still parsed in the sandbox."
