<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Graphite mark: the same "N" tile as `templates/includes/icons.html`
       (icon_brand_mark) — same 32-unit geometry, same rx=6, same glyph path.
       Keep the two in sync; this file is also what `build.rs` rasterizes into
       the tray icon and the Windows exe icon.

       A standalone favicon cannot read the app's CSS custom properties, so the
       fills are literal, and the base pair is the LIGHT theme's accent colour
       and accent ink. Browsers follow the system theme through the dark rule
       below; a non-browser rasterizer skips that block, which is why `build.rs`
       rewrites these two literals to derive each tray variant — see
       `src/tray/icon_gen.rs`.

       The glyph is a path, not <text>: a font glyph would resolve differently
       per platform (and per font set on the build machine), which is what made
       the old marks drift. -->
  <style>
    @media (prefers-color-scheme: dark) {
      .brand-tile { fill: #eeeeee; }
      .brand-glyph { fill: #111111; }
    }
  </style>
  <rect class="brand-tile" width="32" height="32" rx="6" fill="#202020"/>
  <!-- Hairline rim, painted out with stroke-opacity=0 in the tab and in every
       tray variant; only the Windows exe icon turns it on (`exe_mark` in
       `src/tray/icon_gen.rs`, which substitutes the literal below). The exe
       icon is one asset that cannot follow the shell theme, and its graphite
       tile is the same value as Windows 11's dark shell background, so without
       the rim the tile loses its silhouette there. Inset by half the stroke so
       the 32-unit viewBox clips nothing. Its colour is a literal of its own so
       `recolor` does not rewrite it. -->
  <rect class="brand-rim" x="0.5" y="0.5" width="31" height="31" rx="5.5"
        fill="none" stroke="#8c8c8c" stroke-width="1" stroke-opacity="0"/>
  <path class="brand-glyph" fill="#ffffff" d="M9 9h2.6v14H9zM20.4 9H23v14h-2.6zM9 9h3.4l10.6 14h-3.4z"/>
</svg>
