[package]
name = "infra"
version = "0.1.20"
edition = "2024"
description = "Infrastructure layer for nanofile — entities, storage, crypto, config"
license = "MIT"

[lints]
workspace = true

[dependencies]
base = { path = "../base", features = ["with-sea-orm"] }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
dotenvy = "0.15"

# `runtime-tokio`, not `runtime-tokio-rustls`: this deployment only ever opens
# SQLite, so sqlx needs no TLS at all. The TLS the binary does speak is SMTP,
# and that comes from `lettre` (rustls/ring) in `server`.
sea-orm = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-uuid",
    "serde",
] }

aes = { workspace = true }
cbc = { workspace = true }
aes-gcm-siv = "0.12"
hkdf = "0.13"
sha1 = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
# Only `hash_password_into` is used, which needs nothing but `alloc`; the
# default features would additionally pull `password-hash`/`getrandom`/`phc`.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
rand = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }

flate2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }

