name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Formatting ──────────────────────────────────────────────────────
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ── Linting ─────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild
      - run: cargo clippy --all-targets -- -D warnings

  # ── Frontend tests (pure JS, no npm deps) ──────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test --experimental-test-coverage "server/frontend/**/*.test.js"

  # ── Playwright e2e (browser) ────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild
      - name: Build nanofile binary
        run: cargo build --bin nanofile
      - name: Install e2e deps
        run: npm install --prefix e2e
      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run --prefix e2e test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/server.log

  # ── Tests (linux only, fastest) ─────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: cargo test --workspace -- --nocapture

