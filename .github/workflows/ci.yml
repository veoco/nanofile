name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Detect which areas changed, so Rust jobs can be skipped on pure
  #    frontend/docs changes ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'server/build.rs'
              - 'server/static/**'
              - 'server/templates/**'
              - 'server/frontend/**'
            frontend:
              - 'server/frontend/**'
              - 'server/static/**'
              - 'server/templates/**'

  # ── Formatting + linting (single job to reuse checkout/toolchain) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Comments must explain the invariant, not cite an external audit item
      # number: those references are meaningless to a reader who does not have
      # the report, and they go stale as soon as the code moves.
      - name: Reject dangling audit-item markers in comments
        run: |
          if grep -rnE '\b[CHML]-[0-9]+\b' \
              --include='*.rs' --include='*.toml' \
              base infra server migration config.toml.example \
            | grep -vE 'CRC-32|INC-'; then
            echo "::error::Replace audit-item markers with the invariant they refer to."
            exit 1
          fi

  # ── Optional tray feature (compiled out by default; keep it healthy) ──
  tray-check:
    name: Tray feature
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nanofile"
      - name: Install tray system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild
      - name: Test with tray feature
        run: cargo test -p server --features tray --bin nanofile -- --nocapture

  # ── Frontend tests (pure JS, no npm deps) ──────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test --experimental-test-coverage "server/frontend/**/*.test.js"

  # ── Playwright e2e (browser) ────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild
      - name: Build nanofile binary
        run: cargo build --bin nanofile
      - name: Install e2e deps
        run: npm install --prefix e2e
      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run --prefix e2e test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/server.log

  # ── Tests (linux only, fastest) ─────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "nanofile"

      - name: Install Tailwind CSS
        run: npm install --silent tailwindcss @tailwindcss/cli esbuild

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: cargo test --workspace -- --nocapture

