name: CI

# Actions are pinned to full commit SHAs (tag kept in a trailing comment) so a
# moved or hijacked tag cannot inject code into CI. Dependabot is deliberately
# not enabled on this repository: refresh a pin by resolving the new tag
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`) and
# updating every occurrence.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Manual entry point: "Run workflow" runs the full suite regardless of the
  # changed-file filter. Useful after a force-push (whose tree can match the
  # previous commit, making the filter skip everything) or to re-run every job
  # from the UI — a plain "Re-run all jobs" reuses the original event and would
  # skip again.
  workflow_dispatch:
    inputs:
      force:
        description: Run all jobs regardless of which files changed (use after a force-push or to re-run everything).
        type: boolean
        default: true

# One run per ref per event, newest wins. The head commit's tree is what a run
# verifies, so a superseded push cannot have found anything the newer one will
# not. The event is part of the group so a pull request's run and a push's run of
# the same branch do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository. Paired with the
# full-SHA action pins, a compromised action or a malicious PR cannot push,
# comment on issues, or read secrets beyond what a read token allows.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `actions/checkout` creates the repository with `git init`, and a fresh
  # repository prints a long hint about the initial branch name on every job.
  # The repository's default branch is `main`, so setting it here silences the
  # hint without a pre-checkout step in each of the jobs below.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ── Detect which areas changed, so Rust jobs can be skipped on pure
  #    frontend/docs changes ────────────────────────────────────────────
  #
  # Fail-open: the filter decides only *which* jobs to skip on an ordinary
  # fast-forward push. A force-push (`github.event.forced`) rewrites history, so
  # the diff against `github.event.before` is not a trustworthy "what changed"
  # signal — and an amend that keeps the same tree would otherwise skip every
  # job. A manual dispatch defaults to `force`, so "Run workflow" always runs
  # the full suite. In both cases the outputs are forced true, never false.
  changes:
    runs-on: ubuntu-latest
    # `dorny/paths-filter` lists a pull request's files through the API, which
    # the default token may only do with `pull-requests: read`; the
    # workflow-level `contents: read` alone leaves the scope unset, and the
    # action fails instead of falling back to a git diff. `contents: read` is
    # repeated here because a job-level block replaces the workflow-level one.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust == 'true' || github.event.forced == true || inputs.force == true }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event.forced == true || inputs.force == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'server/build.rs'
              - 'server/static/**'
              - 'server/templates/**'
              - 'server/frontend/**'
              # The probe's documents, images and clips are compiled into the
              # binary with `include_bytes!`, so a fixture change is a build
              # change even when no `.rs` file moved with it.
              - 'server/tests/fixtures/**'
              - 'server/models/**'
              - 'tools/models/**'
              # build.rs shells out to the pinned esbuild/tailwind versions, so
              # a dependency bump is a build change.
              - 'package.json'
              - 'package-lock.json'
              # Editing CI itself must run CI: otherwise a workflow-only commit
              # reports success with every job skipped (which is how an earlier
              # audit-job change went unverified).
              - '.github/workflows/**'
            frontend:
              - 'server/frontend/**'
              - 'server/static/**'
              - 'server/templates/**'
              - 'package.json'
              - 'package-lock.json'

  # ── Formatting + linting (single job to reuse checkout/toolchain) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      # The two Rust cache families, and the one rule that keeps them useful:
      # `nanofile` holds check-only artifacts (clippy and rustdoc, nothing
      # linked) and `nanofile-build-v2` holds linked dev/test codegen. A GitHub
      # cache entry is immutable — the first job to save a key defines it for
      # every later run — so a job must use the family that matches what it
      # writes. A check-only entry under a build job's key makes that job
      # recompile the whole dependency graph on every run: that is ~380 crates,
      # 4-6 minutes on macOS and Windows.
      #
      # The build family has one writer, `tests` (see the note on `tray-check`):
      # the entry is therefore the non-tray feature set the long row needs,
      # instead of whichever of `tests` and `tray-check` happened to save first.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # A broken intra-doc link or a doc comment Markdown misparses is a
      # documentation defect like any other. `--bins` covers `main.rs` and its
      # modules, which the default lib-only pass never sees.
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --bins --no-deps --document-private-items
      # Comments must explain the invariant, not cite an external audit item
      # number: those references are meaningless to a reader who does not have
      # the report, and they go stale as soon as the code moves.
      - name: Reject dangling audit-item markers in comments
        run: |
          if grep -rnE '\b[CHML]-[0-9]+\b' \
              --include='*.rs' --include='*.toml' \
              base infra server migration config.toml.example \
            | grep -vE 'CRC-32|INC-'; then
            echo "::error::Replace audit-item markers with the invariant they refer to."
            exit 1
          fi
      # An unused direct dependency, and a dependency that comes back as a side
      # effect of some default feature, are both invisible to rustc: AWS-LC
      # returned once through `reqwest`'s TLS, the ravif/rav1e AV1 encoder
      # through `image`'s default formats, and zstd-sys through `include-flate`'s
      # default features. The content analyzer is dictionary-free and embedded
      # assets are DEFLATE-only now; these two checks keep both properties.
      - name: Install cargo-machete
        # crates.io, not the release CDN: install-action's prebuilt download has
        # answered 504 often enough to fail a lint row, and this crate is small.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-machete --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo-machete --version
      - name: Reject unused and deliberately avoided dependencies
        run: |
          cargo machete
          # `cargo tree` failing must fail the step too, so its output is taken
          # with an assignment rather than piped straight into `grep`.
          tree="$(cargo tree --workspace --prefix none)"
          if printf '%s\n' "$tree" | grep -E '^(aws-lc-rs|aws-lc-sys|rav1e|ravif|zstd-sys|jieba-rs|tract-cuda|tract-metal|tract-wgpu|ort|ort-sys|onnxruntime|onnxruntime-sys|openblas-src|accelerate-src) v'; then
            echo "::error::A default feature pulled back in a dependency this project avoids; see the notes in server/Cargo.toml."
            exit 1
          fi

  # ── Linting off Linux ───────────────────────────────────────────────
  # `#[cfg(windows)]` and `#[cfg(target_os = "macos")]` code is not compiled on
  # the `lint` job's runner, so clippy there cannot see it. Not a dependency of
  # the other jobs: the Linux `lint` job stays the fast gate while these rows run
  # beside the suite. The `tray` feature is linted by `tray-check`, which covers
  # the same platforms.
  lint-platforms:
    name: Lint (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-amd64 }
    # Check-only, in the same `nanofile` family as the Linux `lint` job: this
    # job compiles without linking, so its `shared-key` must never be the one
    # `tests` writes. The `CARGO_*` debug values are part of the cache key and
    # not of what clippy emits (a check unit produces no object code); they keep
    # this job's existing entries matching.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --bins --no-deps --document-private-items

  # ── Optional tray feature (compiled out by default; keep it healthy) ──
  # One definition and three runners: the tray unit tests sit behind a feature
  # the default suite never enables, so a Linux-only row left the macOS and
  # Windows halves of that code to a release build. No per-OS package step is
  # needed: the Linux tray is served over the session bus, and macOS and Windows
  # link their own toolkits.
  tray-check:
    name: Tray feature (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A deadline for a hang, not for a slow run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-amd64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-amd64 }
    # Same `debug` values and the same `nanofile-build-v2` key as `tests`. That
    # key has a single writer: `tests` (the critical path) saves it, and this
    # row only restores it. The tray build then recompiles its own feature
    # crates — a handful, on a job that is not the critical path — instead of
    # the tests row recompiling the dependency graph because this row saved a
    # tray-feature target first and the entry is immutable.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # `cargo clippy` below needs it, and asking for it is what makes the
          # step independent of whatever the runner image happens to preinstall.
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile-build-v2"
          save-if: false
      - name: Cache cargo-nextest
        id: nextest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-0.9.151-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        # `bash`, not the runner's default `pwsh`: the retry loop below is a
        # shell script, and Windows picks PowerShell for `run` by default.
        shell: bash
        # GitHub's release downloads intermittently answer 504; compiling from
        # crates.io is slower but does not depend on that CDN. The binary is
        # cached, so this is a one-time cost per OS and architecture.
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-nextest --version 0.9.151 --locked --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo nextest --version
      - name: Install Tailwind CSS
        run: npm ci
      - name: Lint with the tray feature
        run: cargo clippy -p server --features tray --bin nanofile -- -D warnings
      - name: Check tray rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc -p server --features tray --bins --no-deps --document-private-items
      - name: Test with tray feature
        # The tray unit tests are isolated per process like the rest of the
        # suite; `--profile ci` adds the retry and timeout policy.
        run: cargo nextest run -p server --features tray --bin nanofile --profile ci

  # ── Frontend tests (pure JS, no npm deps) ──────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node --test --experimental-test-coverage "server/frontend/**/*.test.js"

  # ── Playwright e2e (browser) ────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Install Tailwind CSS
        run: npm ci
      - name: Build nanofile binary
        run: cargo build --bin nanofile
      - name: Install e2e deps
        run: npm ci --prefix e2e
      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run --prefix e2e test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/**/server.log

  # ── Dependency advisories ───────────────────────────────────────────
  audit:
    name: Crate audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-audit
        # Same reason as cargo-machete: crates.io with retries instead of the
        # release CDN, which has been answering 504.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-audit --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo-audit --version
      # Fails on vulnerabilities only; unmaintained/unsound crates are reported
      # as warnings. Four are expected: `zvariant`, `zvariant_derive` and
      # `zbus_names` (zbus 5, which `ksni` and `notify-rust` pin) and
      # `basic-toml` (askama's derive). None has a fixed release to move to yet;
      # a vulnerability in any crate still fails the step.
      - name: Check for known vulnerabilities
        run: cargo audit

  # ── Every Linux target we ship that has no runner ───────────────────
  # The build matrices carry six Linux targets. x86_64-linux-gnu runs natively
  # in the `linux-amd64` row below and aarch64-linux-gnu in its `linux-arm64`
  # sibling, so these four are compiled by nothing else: a syscall name that only
  # exists on x86_64, or a musl-only libc module, would otherwise reach a release
  # artifact first. Their arch-specific code is also linted here, which no other
  # row can do: clippy only ever sees the `target_arch` it is running on.
  cross-check:
    name: Cross check (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - loongarch64-unknown-linux-gnu
          - loongarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
          # The wrapped build below runs clippy's lints.
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      # `cargo check` cannot do this: its C compiler is `cc`, which hands zig the
      # Rust triple (`x86_64-unknown-linux-musl`) and zig parses only
      # `arch-os-abi`. cargo-zigbuild converts the triple and wires the linker,
      # and it is the path nightly.yml and release.yml build these targets with.
      # The archive is pinned to its published SHA-256, as it is there.
      - name: Install zig
        run: |
          curl -sL --retry 3 --retry-delay 2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
      # crates.io with retries instead of the release CDN: the latter has
      # answered 504 often enough to fail a cross row. The compile is small next
      # to the cross build it enables; the version pin stays 0.23.4.
      - name: Install cargo-zigbuild
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-zigbuild --version 0.23.4 --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo-zigbuild --version
      # clippy-driver as the workspace wrapper runs clippy's lints inside the same
      # `cargo zigbuild` pass: no second compile, and the zig CC/linker wiring
      # cargo-zigbuild already sets up is reused instead of re-derived (`cargo
      # clippy --target` would have to reproduce it, because this graph's bundled
      # SQLite needs a C compiler for the target — cc-rs otherwise stops at
      # `failed to find tool "loongarch64-linux-gnu-gcc"`). What denies the lints
      # is `[workspace.lints.clippy]` in Cargo.toml; the wrapper is what runs them.
      #
      # `clippy::all` and not `-D warnings`: zig's `linker stderr: ignoring
      # deprecated linker optimization setting '1'` arrives through the
      # `linker_messages` lint and would fail every row.
      - name: Build and lint the workspace for the target
        env:
          RUSTC_WORKSPACE_WRAPPER: clippy-driver
        run: cargo zigbuild --workspace --target "${{ matrix.target }}"

  # ── The Rust suite, minus the OCR cases, on every platform we ship ───
  # One definition and four runners, so "the platform runs the same tests" is
  # what the file says rather than what someone remembered to copy. The OCR
  # cases are the one exception: they are the slowest tests in the suite and
  # run in `ocr-tests` on the two architectures that carry the model. The media
  # tests need a real helper and fail on CI without one, which is why every
  # runner installs it.
  #
  # `nanofile-build-v2` is the codegen family: this job is its only writer, so
  # a hit always carries the non-tray test binaries it links. The lint rows use
  # `nanofile`, which holds check-only output (see `lint`); sharing that key
  # here is what used to make every run rebuild the dependency graph.
  #
  # This row does not wait for `lint`: the long suite and the lint gate are
  # independent, and starting here removes a ~2m40s serial gate from the
  # critical path. A lint failure still fails the run; the cost is runner time
  # spent while lint was already red.
  #
  # No test-side switch decides whether a launch asks for the AppContainer: it
  # always does, and the runner's own answer is what the sandbox tests assert.
  # On GitHub's Windows runners that answer has been the bound under the job
  # object with `files=open`, which is the shape a host sandbox that refuses a
  # nested container produces; a runner that can create one is asserted through
  # the container branch instead.
  tests:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A deadline for a hang, not for a slow run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-amd64 }
          - { os: ubuntu-24.04-arm, label: linux-arm64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-amd64 }
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile-build-v2"
          # A red test row still has a usable build. Saving it keeps the next
          # rerun from paying the full dependency compile again, which is what
          # a flaky Windows test would otherwise force on every attempt.
          cache-on-failure: true
      - name: Cache cargo-nextest
        id: nextest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-0.9.151-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        # `bash`, not the runner's default `pwsh`: the retry loop below is a
        # shell script, and Windows picks PowerShell for `run` by default.
        shell: bash
        # GitHub's release downloads intermittently answer 504; compiling from
        # crates.io is slower but does not depend on that CDN. The binary is
        # cached, so this is a one-time cost per OS and architecture.
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-nextest --version 0.9.151 --locked --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo nextest --version
      - name: Install Tailwind CSS
        run: npm ci
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          # `-qq` keeps apt's package lists and per-package unpack lines out of
          # the log; errors still reach stderr. `--no-install-recommends`:
          # without it apt pulls 99 packages, most of them video drivers and
          # subtitle libraries no assertion can reach.
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          echo "NANOFILE_TEST_FFMPEG_PATH=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -z "$(command -v ffmpeg || true)" ]; then
            if ! brew install ffmpeg >/tmp/brew.log 2>&1; then
              echo "::error::brew could not install ffmpeg; the media tests need a real helper"
              tail -20 /tmp/brew.log
              exit 1
            fi
          fi
          FFMPEG="$(command -v ffmpeg || true)"
          if [ -z "$FFMPEG" ]; then
            echo "::error::no ffmpeg on this runner; the media tests need a real helper"
            exit 1
          fi
          echo "NANOFILE_TEST_FFMPEG_PATH=$FFMPEG" >> "$GITHUB_ENV"
      - name: Install ffmpeg (Windows)
        # `bash`, not the runner's default `pwsh`: the media grant reaches the
        # one file the parent names and nothing it starts, so the tests are handed
        # the binary itself rather than the shim a package manager puts on `PATH`.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The `find`s below are allowed to come up empty: the step runs with
          # `-e -o pipefail`, and a package directory that is not there (or a
          # `head` that closes the pipe) would otherwise abort it before the next
          # installer is tried. Every location a package manager on this image is
          # known to use is searched, and `PATH` is the last resort: a miss here
          # means the media assertions silently stop being measured.
          FFMPEG=""
          if command -v winget >/dev/null 2>&1; then
            echo "installing ffmpeg with winget"
            # The progress bar is written with carriage returns and block
            # characters, one screenful per update; keep it in a file and only
            # show it when the install fails.
            if winget install --id Gyan.FFmpeg -e --silent --disable-interactivity \
              --accept-package-agreements --accept-source-agreements \
              > /tmp/winget.log 2>&1; then
              echo "winget installed ffmpeg"
            else
              echo "winget could not install ffmpeg; tail of its log:"
              tail -20 /tmp/winget.log
            fi
            FFMPEG="$(find "$(cygpath -u "$LOCALAPPDATA")/Microsoft/WinGet/Packages" \
              -name ffmpeg.exe 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$FFMPEG" ]; then
            echo "no winget result; installing ffmpeg with Chocolatey"
            choco install ffmpeg -y --no-progress
            # Chocolatey puts the binary either in the package's `tools` directory
            # or in the shim directory beside it, and the layout has moved between
            # image releases.
            FFMPEG="$(find /c/ProgramData/chocolatey/lib/ffmpeg/tools \
              /c/ProgramData/chocolatey/bin \
              -name ffmpeg.exe -type f 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$FFMPEG" ]; then
            FFMPEG="$(command -v ffmpeg || true)"
          fi
          if [ -z "$FFMPEG" ]; then
            # Say where the packages did land, so the next run can be fixed
            # without another guessing round.
            for directory in /c/ProgramData/chocolatey/lib \
              "$(cygpath -u "$LOCALAPPDATA")/Microsoft/WinGet/Packages"; do
              if [ -d "$directory" ]; then
                echo "--- $directory"
                find "$directory" -maxdepth 3 -iname 'ffmpeg*' 2>/dev/null | head -20
              fi
            done
            echo "::error::ffmpeg could not be installed; the media tests need a real helper"
            exit 1
          fi
          # Timed: this is the install's own first execution of the binary, paid
          # here rather than inside the probe, which measures the sandbox.
          time "$FFMPEG" -version >/dev/null
          echo "NANOFILE_TEST_FFMPEG_PATH=$(cygpath -w "$FFMPEG")" >> "$GITHUB_ENV"
      - name: Run the workspace suite
        # nextest runs every test in its own process, so one test's
        # process-global sandbox state cannot reach another; `--profile ci` in
        # `.config/nextest.toml` retries a failed test alone, caps the OCR group
        # at two model passes, and prints only failures and slow tests. The OCR
        # cases are the slowest and run in `ocr-tests` instead.
        run: cargo nextest run --workspace --profile ci -E 'not test(/ocr/)'

      - name: Run doctests
        # nextest does not run doctests, so they keep their own `cargo test`
        # step.
        run: cargo test --workspace --doc --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nextest-junit-${{ matrix.label }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # ── OCR tests, beside the main suite ───────────────────────────────
  # The PP-OCR graphs are the slowest tests in the suite: two to four minutes of
  # CPU per platform. Keeping them in every main row made that row's CPU the
  # wall clock, so they run here, in parallel with it. The model is pure Rust,
  # but the OCR profile runs through the platform's sandbox (AppContainer,
  # Seatbelt, Landlock), so every OS we ship runs this job; linux-arm64 shares
  # the aarch64 model path with macOS but not a sandbox implementation, and its
  # main row still covers the non-OCR sandbox cases.
  ocr-tests:
    name: Ocr tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A deadline for a hang, not for a slow run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux-amd64 }
          - { os: macos-latest, label: macos-arm64 }
          - { os: windows-latest, label: windows-amd64 }
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "nanofile-build-v2"
          save-if: false
      - name: Cache cargo-nextest
        id: nextest-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-0.9.151-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        # `bash`, not the runner's default `pwsh`: the retry loop below is a
        # shell script, and Windows picks PowerShell for `run` by default.
        shell: bash
        # GitHub's release downloads intermittently answer 504; compiling from
        # crates.io is slower but does not depend on that CDN. The binary is
        # cached, so this is a one-time cost per OS and architecture.
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-nextest --version 0.9.151 --locked --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo nextest --version
      - name: Install Tailwind CSS
        run: npm ci
      - name: Run the OCR tests
        # Only the targets that carry OCR cases are built: the lib covers the
        # engine and index unit cases, the four integration targets the
        # end-to-end scans. The filter is the same one the main row excludes.
        run: >-
          cargo nextest run
          -p server --lib
          --test index_test
          --test model_assets_test
          --test sandbox_probe_test
          --test sandbox_protocol_test
          --profile ci
          -E 'test(/ocr/)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nextest-junit-ocr-${{ matrix.label }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
