name: CI

# Actions are pinned to full commit SHAs (tag kept in a trailing comment) so a
# moved or hijacked tag cannot inject code into CI. Dependabot is deliberately
# not enabled on this repository: refresh a pin by resolving the new tag
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`) and
# updating every occurrence.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # The Windows and macOS jobs are opt-in (see `platform_run` in the `changes`
  # job) because they are the two slow ones — 12m and 5m against a 3m Linux path
  # — and most pushes cannot change what they measure. This input is the switch
  # that works from the web UI or `gh workflow run`; `[platform]` in a commit
  # subject is the one that works from a push.
  workflow_dispatch:
    inputs:
      platform:
        description: "Also run the Windows and macOS jobs"
        type: boolean
        default: true

# One run per ref, newest wins. The head commit's tree is what a run verifies,
# so a superseded run cannot have found anything the newer one will not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repository. Paired with the
# full-SHA action pins, a compromised action or a malicious PR cannot push,
# comment on issues, or read secrets beyond what a read token allows.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Detect which areas changed, so Rust jobs can be skipped on pure
  #    frontend/docs changes ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      platform: ${{ steps.filter.outputs.platform }}
      platform_run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            # What the Windows and macOS jobs need: Rust that those targets
            # compile through different `cfg` blocks. `server/templates/**`,
            # `server/static/**`, `server/frontend/**` and `package.json` are
            # compiled by `build.rs` on every platform, so a change to one that
            # broke a platform would break Linux first — and `lint` says so in a
            # minute instead of on two slow runners.
            platform:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'server/build.rs'
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'server/build.rs'
              - 'server/static/**'
              - 'server/templates/**'
              - 'server/frontend/**'
              # build.rs shells out to the pinned esbuild/tailwind versions, so
              # a dependency bump is a build change.
              - 'package.json'
              - 'package-lock.json'
              # Editing CI itself must run CI: otherwise a workflow-only commit
              # reports success with every job skipped (which is how an earlier
              # audit-job change went unverified).
              - '.github/workflows/**'
            frontend:
              - 'server/frontend/**'
              - 'server/static/**'
              - 'server/templates/**'
              - 'package.json'
              - 'package-lock.json'
      # A push cannot be labelled, so its opt-in is a trailer in the commit
      # subject. Everything that reaches the shell arrives through `env` rather
      # than through `${{ }}` inside `run:`: a commit message is text an author
      # controls, and interpolating it into a script would execute it.
      - name: Decide whether the platform jobs run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ inputs.platform }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run=false
          case "$EVENT" in
            workflow_dispatch) run="${DISPATCH:-true}" ;;
            pull_request) case ",$LABELS," in *,ci:platform,*) run=true ;; esac ;;
            push) case "$MESSAGE" in *"[platform]"*) run=true ;; esac ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # ── Formatting + linting (single job to reuse checkout/toolchain) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Comments must explain the invariant, not cite an external audit item
      # number: those references are meaningless to a reader who does not have
      # the report, and they go stale as soon as the code moves.
      - name: Reject dangling audit-item markers in comments
        run: |
          if grep -rnE '\b[CHML]-[0-9]+\b' \
              --include='*.rs' --include='*.toml' \
              base infra server migration config.toml.example \
            | grep -vE 'CRC-32|INC-'; then
            echo "::error::Replace audit-item markers with the invariant they refer to."
            exit 1
          fi

  # ── Optional tray feature (compiled out by default; keep it healthy) ──
  tray-check:
    name: Tray feature
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    # Same `debug` reduction as the `test` job, and deliberately identical
    # values: rust-cache keys on `CARGO_*`, so matching them keeps this job and
    # `test` on one Linux cache entry instead of two.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install tray system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Install Tailwind CSS
        run: npm ci
      - name: Lint with the tray feature
        run: cargo clippy -p server --features tray --bin nanofile -- -D warnings
      - name: Test with tray feature
        run: cargo test -p server --features tray --bin nanofile -- --nocapture

  # ── Windows-only code: the Service Control Manager front-end and the Win32
  #    tray back-end. Every other job runs on Linux, where
  #    `#[cfg(target_os = "windows")]` blocks are not compiled at all, so
  #    without this job a Windows build break would only surface in the
  #    nightly/release builds. Scope: the binary that ships, with the tray
  #    feature the Windows artifacts are built with.
  windows-check:
    name: Windows check
    runs-on: windows-latest
    needs: [changes, lint]
    # Opt-in, and only when Rust changed: see `platform_run` in the `changes`
    # job. `[platform]` in a commit subject is how a push asks for it.
    if: >-
      needs.changes.outputs.platform == 'true'
      && needs.changes.outputs.platform_run == 'true'
    # A deadline for a hang, not for a slow run: the steps below have their own.
    #
    # Deliberately no `CARGO_PROFILE_*_DEBUG=0` here, unlike the Linux jobs.
    # rust-cache keys on `CARGO*`, so setting it re-keys this job's cache, and
    # this job now runs rarely enough that reusing the cache is worth more than
    # the codegen it would save. Measured with it: the check step took 203s and
    # the cache restore 84s, against 87s and 51s before the change.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      # `--all-targets` is what reaches the test code: the extraction worker
      # confines *itself* on Windows with a Job Object, and that module is only
      # type-checked where its target's tests are built. This is also the only
      # job that type-checks the whole test suite on Windows.
      #
      # A second step here checked `--features tray --bin nanofile` as well, and
      # it is gone: `check` output is never reused by the `build` and `test`
      # below, so it cost 90s of its own, and `tray` is a feature rather than a
      # platform — the nightly workflow already builds `windows-amd64-tray`
      # natively every night. Put it back if a tray-only Windows break reaches
      # `main`.
      - name: Check the Windows code and its tests
        run: cargo check -p server --all-targets
      # ... and the Job Object, the restricted token and the pipes the protocol
      # runs over only exist at runtime, which no other job can reach: everything
      # else runs on Linux, where none of this code is compiled. The probe
      # starts the child exactly as the server does and reports what the child
      # found, so a Job Object that could not be created or a token the system
      # refused shows up here rather than in a release.
      - name: Run the extraction sandbox probe
        # `bash`, not the runner's default `pwsh`: this step asserts with `grep`,
        # and PowerShell fails on neither a native command's non-zero exit code
        # nor a missing tool the way `bash -eo pipefail` does.
        shell: bash
        run: |
          cargo build --bin nanofile
          ./target/debug/nanofile.exe extract-worker --probe | tee sandbox.txt
          grep -q 'profile=documents' sandbox.txt
          # The token is read back from the process rather than believed from
          # the command line the parent wrote.
          grep -q 'token=restricted' sandbox.txt
          # The job is the parent's, named at creation, and the child reads its
          # limits back from it: `,parent` is the mark of that arrangement, and
          # `limits-missing` is what a job without them would report instead.
          grep -q 'job=memory' sandbox.txt
          grep -q ',parent' sandbox.txt
          grep -q 'container=appcontainer' sandbox.txt
          grep -q 'files=denied' sandbox.txt
          grep -q 'network=denied' sandbox.txt
          # The integrity level the token ended up with, which the container
          # sets. Asserted as a fact rather than as a value: a label this side
          # sets is one the token-only fallback cannot survive.
          grep -qE 'il=(untrusted|low|medium)' sandbox.txt
          # How many process mitigations the kernel took and the child read
          # back. The count moves with the Windows build; zero would mean the
          # API is not working at all.
          grep -qE 'mitigations=[1-9][0-9]*' sandbox.txt
          # The far edge of the files protection: the container refuses the
          # user's own paths (above). The system tree stays readable through the
          # packages a low-box process is checked against — not through the
          # user's own SID, and not a documented invariant — so a host that
          # answered `denied` would be stricter than the platform and both are
          # asserted; a change to either is deliberate.
          grep -qE 'system=(readable|denied|absent)' sandbox.txt
          # Which container the launch asked for and got. `off` is what
          # Windows 10 answers, where the attribute does not exist.
          grep -qE 'lpac=(on|off)' sandbox.txt
          # Which creation the parent settled on, and where a write from it
          # lands. `store` means the file resolved into the container's own
          # redirected store; `user` means it did not, which is a fact the report
          # states rather than labels benign.
          grep -qE 'rung=(container|container-only|token|plain)' sandbox.txt
          grep -qE 'writes=(store|user|denied|unmeasured)' sandbox.txt
          grep -q 'threads=ok' sandbox.txt
          # Every protection, not `partial|full`: the container is the one this
          # host can lose on its own, and losing it now fails here.
          grep -q 'level=full' sandbox.txt
          # ... and the confined child can still read a document, which the item
          # count cannot say.
          grep -q 'parse=pdf-ok,docx-ok' sandbox.txt

      # The media profile is the one that may execute a helper, so it is probed
      # with the helper it will actually be given: a packaged ffmpeg.
      #
      # winget, and Chocolatey only as the fallback: the Windows Server 2025
      # images carry winget even though the image's own software list does not
      # mention it, while the older ones carry Chocolatey and no winget — the
      # maintainers turned winget down for those as incompatible with Server.
      # Which one ran is printed below.
      #
      # The package's `PATH` entry is deliberately not used. It is a shim: an
      # executable that starts the real ffmpeg (Chocolatey writes one, and a
      # portable winget package gets a link). The media grant reaches the one
      # helper the parent named and nothing else, so a probe handed the shim
      # would measure the shim's second generation being refused — a fact about
      # the launcher, not about the sandbox.
      - name: Install ffmpeg
        shell: bash
        run: |
          FFMPEG=""
          if command -v winget >/dev/null 2>&1; then
            echo "installing ffmpeg with winget"
            winget install --id Gyan.FFmpeg -e --silent --disable-interactivity \
              --accept-package-agreements --accept-source-agreements || true
            FFMPEG="$(find "$(cygpath -u "$LOCALAPPDATA")/Microsoft/WinGet/Packages" \
              -name ffmpeg.exe 2>/dev/null | head -1)"
          fi
          if [ -z "$FFMPEG" ]; then
            echo "no winget on this image; installing ffmpeg with Chocolatey"
            choco install ffmpeg -y --no-progress
            FFMPEG="$(find /c/ProgramData/chocolatey/lib/ffmpeg/tools -name ffmpeg.exe \
              -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$FFMPEG" ]; then
            echo "ffmpeg could not be installed; the media probe falls back to the worker's own image"
            exit 0
          fi
          echo "ffmpeg=$FFMPEG"
          # Timed: this is the install's own first execution of the binary, and it
          # is paid here rather than inside the probe below, which measures the
          # sandbox rather than this machine.
          time "$FFMPEG" -version >/dev/null
          echo "FFMPEG_WIN=$(cygpath -w "$FFMPEG")" >> "$GITHUB_ENV"

      # `level=partial` and `process=open` are the point of the row: this profile
      # starts a program by definition — that is what a helper is — so it cannot
      # carry the process item and must not pretend to. `helper=allowed` is the
      # fact beside it (the container could open the helper the parent granted),
      # and `parse=` is the effect: the helper starts and answers.
      #
      # The helper is where winget put it, several levels down inside the user
      # profile, which is what makes this step the one that measures the grant's
      # cost. It did not always: an earlier version copied the worker's own image
      # into `Program Files` when no ffmpeg was installed, and granted the
      # container the traverse to reach the helper by writing a DACL on every
      # ancestor. `SetNamedSecurityInfo` re-imposes inheritance on everything
      # below the object it writes, so that walk rewrote the ACLs of the whole
      # tree under `C:\Program Files` — or `C:\Users\<user>` — which took 7 to 10
      # minutes of I/O, and 4m39s using 0.4s of CPU on the run that timed itself.
      # The grant is written on the files alone now, and how long this step takes
      # is asserted rather than described.
      #
      # The helper starting is what the null device used to prevent: `NUL` is a
      # device a container may refuse to open, and that refusal arrives from the
      # same call as the process creation — which read as "the container cannot
      # start a helper" until the streams became pipes.
      - name: Probe the media sandbox profile
        shell: bash
        run: |
          HELPER="${FFMPEG_WIN:-$(cygpath -w "$PWD/target/debug/nanofile.exe")}"
          echo "probing the media profile with helper=$HELPER"
          start=$(date +%s)
          ./target/debug/nanofile.exe extract-worker --probe --profile media \
            --ffmpeg "$HELPER" | tee media.txt
          elapsed=$(( $(date +%s) - start ))
          echo "the media probe took ${elapsed}s"
          # A grant that walks the ancestors again would show up here as minutes
          # rather than seconds. The deadline is not a performance target, it is
          # the shape of that error: a directory DACL write re-imposes inheritance
          # on everything under it, so this cannot be a slow step.
          if [ "$elapsed" -gt 60 ]; then
            echo "::error::the media probe took ${elapsed}s; a grant on a directory propagates inheritance through its whole tree"
            exit 1
          fi
          grep -q 'profile=media' media.txt
          grep -q 'level=partial' media.txt
          grep -q 'process=open' media.txt
          grep -q 'helper=allowed' media.txt
          if [ -n "${FFMPEG_WIN:-}" ]; then
            # ffmpeg answers `-version` and exits 0.
            grep -q 'parse=media-ok' media.txt
          else
            # The worker's own image: it starts and exits non-zero, because
            # `-version` is not one of its flags.
            grep -q 'parse=media-failed' media.txt
          fi

      # Parsing *under* the container, which the probe's self-test does but the
      # whole pipeline does not: a container that denies something a reader
      # needs, or a mitigation that breaks it, shows up as a document that
      # cannot be read rather than as a missing protection.
      - name: Extract documents in the container
        run: cargo test -p server --test index_test -- document

  # ── macOS-only code: the tray back-end, and the Seatbelt profile the
  #    extraction worker runs under. Every other job runs on Linux, where
  #    `#[cfg(target_os = "macos")]` blocks are not compiled at all — and the
  #    profile is not merely compiled but *applied* by `/usr/bin/sandbox-exec`,
  #    so the probe and the document tests below are the only places its effect
  #    on files and on the network is checked well enough to trust.
  macos-check:
    name: macOS check
    runs-on: macos-latest
    needs: [changes, lint]
    # Opt-in, and only when Rust changed: see `platform_run` in the `changes`
    # job. `[platform]` in a commit subject is how a push asks for it.
    if: >-
      needs.changes.outputs.platform == 'true'
      && needs.changes.outputs.platform_run == 'true'
    # Same deadline, and the same decision on debug info: `dsymutil` is what
    # makes a macOS link slow, but re-keying this job's cache costs it more than
    # the symbols do — the check step went 57s to 100s against a warm cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      - name: Check the macOS-only code
        run: cargo check -p server --tests --bin nanofile
      # The sandbox's own unit tests read this process's mapped address space and
      # its footprint — the two numbers the memory limit and its fallback are set
      # from — and neither call can be made anywhere but macOS.
      - name: Test the sandbox's own measurements
        run: cargo test -p server --lib indexer::extract::sandbox
      - name: Run the extraction sandbox probe
        run: |
          cargo build --bin nanofile
          ./target/debug/nanofile extract-worker --probe | tee sandbox.txt
          grep -q 'profile=documents' sandbox.txt
          grep -q 'files=denied' sandbox.txt
          grep -q 'network=denied' sandbox.txt
          grep -q 'threads=ok' sandbox.txt
          grep -q 'level=full' sandbox.txt
          # Starting a program is refused, and the fork the profile has to allow
          # (the parsers' thread is charged to it) is reported as the note it is
          # rather than counted as a process bound.
          grep -q 'exec=denied' sandbox.txt
          grep -q 'fork=open' sandbox.txt
          grep -q 'parse=pdf-ok,docx-ok' sandbox.txt

      # Parsing *under* the profile, which the probe above does not do: a
      # profile that denies something the parsers need shows up as a document
      # that cannot be read, not as a missing protection. The fixture also
      # insists the worker confines itself before the tests run.
      - name: Extract documents under the profile
        run: cargo test -p server --test index_test -- document

      # The media profile is the one that may execute a helper, and until this
      # step existed nothing ran it on this platform: its Seatbelt text was
      # unit-tested and never applied. It reports the profile's shape and that
      # the helper starts — which is what it found missing: the profile granted
      # the helper's image and its interpreter but not the `/dev/null` its
      # standard streams are set to, so the spawn died in its own stdio setup and
      # reported `media-unavailable(EPERM)` next to `helper=allowed`.
      - name: Report the media sandbox profile
        run: |
          FFMPEG="$(command -v ffmpeg || true)"
          if [ -z "$FFMPEG" ]; then
            # The image has no ffmpeg. A packaged one is exactly the case this
            # profile's library grants exist for, so try to install it — and say
            # why if that fails, rather than silently measuring something else.
            if ! brew install ffmpeg >/tmp/brew.log 2>&1; then
              echo "brew could not install ffmpeg; falling back to /bin/echo"
              tail -5 /tmp/brew.log
            fi
            FFMPEG="$(command -v ffmpeg || true)"
          fi
          if [ -z "$FFMPEG" ]; then
            # Still nothing: the cheapest program every macOS host has. It prints
            # the flag it was given and exits zero, so a profile that could start
            # it would report `media-ok`; `exec=denied` below still measures the
            # other side, because `/usr/bin/true` is not the helper.
            FFMPEG=/bin/echo
            echo "no ffmpeg on this runner; probing with /bin/echo as the helper"
          fi
          ./target/debug/nanofile extract-worker \
            --probe --profile media --ffmpeg "$FFMPEG" | tee /tmp/media.txt
          grep -q 'profile=media' /tmp/media.txt
          # The profile cannot have the process item, and says so.
          grep -q 'level=partial' /tmp/media.txt
          # The files item is in place — media is `partial` rather than `none`
          # only because this one is — and the row says how wide it is: the helper
          # and, on this platform, the package-manager trees a packaged build
          # links against.
          grep -q 'files=denied' /tmp/media.txt
          grep -q 'helper_scope=trees' /tmp/media.txt
          grep -q 'process=open' /tmp/media.txt
          grep -q 'helper=allowed' /tmp/media.txt
          # Starting a program other than the helper stays refused. Seatbelt
          # refuses it with EPERM, which is the denial this reads.
          grep -q 'exec=denied' /tmp/media.txt
          # The helper starts: the literals are written as the kernel resolves
          # them (a Homebrew helper is reached through `/opt/homebrew/bin` and
          # checked in the Cellar), and its streams are pipes with `/dev/null`
          # granted for the write the helper itself may want. `hand=` is the same
          # exec attempted by hand in that child.
          grep -q 'parse=media-ok' /tmp/media.txt
          grep -q 'hand=ok' /tmp/media.txt

      # What a probe cannot say: whether a Seatbelt profile can start a second
      # generation of program at all, and which operation the sandbox refuses when
      # it cannot. Synthetic profiles against system binaries answer the first —
      # `bash` is the child, `echo` the program it starts — and the sandbox's own
      # log answers the second. This is the step that ruled the grant out as the
      # cause of the media probe's `EPERM`, so it asserts both edges of the
      # grant: one that was given starts a second generation, one that was not
      # does not.
      - name: Check the Seatbelt grant's shape
        if: always()
        run: |
          # The child is `/bin/bash` and the helper it starts is `/bin/echo`, so
          # the grants below are the ones the media profile's text is made of.
          # `/bin/sh` cannot play the child: on this host it is a shim that
          # re-execs `/bin/bash`, which a literal grant correctly refuses, and the
          # first generation then never runs — which is what the first version of
          # this step measured. One line per profile: a backslash continuation
          # inside single quotes is a literal backslash, not a continuation.
          rm -f /tmp/bisect.txt
          BASE='(version 1) (deny default) (allow process-exec (literal "/bin/bash")) (allow file-read* (literal "/bin/bash")) (allow file-map-executable (literal "/bin/bash"))'
          LIBS='(allow file-read* file-test-existence (literal "/") (subpath "/usr/lib") (subpath "/System/Library") (subpath "/System/Volumes/Preboot/Cryptexes/OS") (literal "/dev/null") (literal "/dev/urandom")) (allow file-map-executable (subpath "/usr/lib") (subpath "/System/Library") (subpath "/System/Volumes/Preboot/Cryptexes/OS")) (allow sysctl-read)'
          ECHO='(allow process-exec (literal "/bin/echo")) (allow file-read* (literal "/bin/echo")) (allow file-map-executable (literal "/bin/echo"))'
          BIN='(allow file-read* file-map-executable (subpath "/bin"))'
          HOMEBREW='(allow file-read* file-map-executable (subpath "/opt/homebrew")) (allow file-read* file-map-executable (subpath "/usr/local")) (allow file-read* file-map-executable (subpath "/opt/local"))'
          FORK='(allow process-fork) (allow signal (target self))'
          run() {
            echo "--- $1"
            if sandbox-exec -p "$2" -- /bin/bash -c "$3" >/dev/null 2>&1; then
              echo "OK $1" | tee -a /tmp/bisect.txt
            else
              echo "DENIED $1" | tee -a /tmp/bisect.txt
            fi
          }
          # Generations: the first is the sandboxed child itself, the second is
          # the helper that child starts — which is what the media profile is for.
          run "first generation, bash only" "$BASE $LIBS" '/bin/echo first'
          run "second generation, helper not granted (control)" "$BASE $LIBS" '/bin/echo control'
          run "second generation, helper granted" "$BASE $ECHO $LIBS" '/bin/echo second'
          run "second generation, helper granted, /bin readable" "$BASE $ECHO $BIN $LIBS" '/bin/echo second-dir'
          run "our media profile, child starts the helper" "$BASE $ECHO $BIN $HOMEBREW $FORK $LIBS" 'exec /bin/echo helper'
          # The two properties this profile rests on, asserted rather than
          # printed: a granted second generation starts, and one that was not
          # granted does not. (The first version of this step only printed, and
          # measured a `/bin/sh` shim for a while before that was noticed.)
          grep -q '^OK second generation, helper granted$' /tmp/bisect.txt
          grep -qx 'OK our media profile, child starts the helper' /tmp/bisect.txt
          grep -qx 'DENIED second generation, helper not granted (control)' /tmp/bisect.txt
          sleep 3
          echo "--- sandbox denials"
          log show --last 1m --info \
            --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "deny"' 2>/dev/null |
            grep -iE "process-exec|file-write-data|mach-lookup com.apple" |
            grep -viE "/usr/bin/true" | tail -25 || true

  # ── Frontend tests (pure JS, no npm deps) ──────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node --test --experimental-test-coverage "server/frontend/**/*.test.js"

  # ── Playwright e2e (browser) ────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install Tailwind CSS
        run: npm ci
      - name: Build nanofile binary
        run: cargo build --bin nanofile
      - name: Install e2e deps
        run: npm ci --prefix e2e
      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run --prefix e2e test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/server.log

  # ── Dependency advisories ───────────────────────────────────────────
  audit:
    name: Crate audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Prebuilt binary: compiling cargo-audit on every run would cost minutes.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities only; unmaintained/unsound crates are reported
      # as warnings. The one ignored advisory is unreachable here:
      # RUSTSEC-2023-0071 (Marvin attack) is in `rsa`, which jsonwebtoken pulls
      # in with its rust_crypto feature, but nanofile only signs and verifies
      # HS256 (HMAC-SHA256) tokens and upstream has no fixed release. Re-check
      # this ignore when jsonwebtoken gains algorithm-level features.
      - name: Check for known vulnerabilities
        run: cargo audit --ignore RUSTSEC-2023-0071

  # ── The Linux sandbox's own report ──────────────────────────────────
  # Its own job rather than the head of the `test` job, where it was: the
  # ffmpeg install and the three reports below are 146s of the 449s that job
  # spent, and none of them depends on the suite. As a sibling they run beside
  # it instead of in front of it.
  sandbox:
    name: Linux sandbox
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    # Same `debug` reduction as `test`, and deliberately identical values:
    # rust-cache keys on `CARGO*`, so matching them keeps this job and `test`
    # on one Linux cache entry rather than two.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"

      - name: Install Tailwind CSS
        run: npm ci

      - name: Install ffmpeg
        # `--no-install-recommends`: without it apt pulls 99 packages and
        # 12.4 MB, most of them video drivers (`i965-va-driver`,
        # `libnvidia-encode1`) and subtitle libraries no assertion here can
        # reach. The encoder is a dependency, not a recommendation.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # This report says which layers the kernel gave the worker and why, which
      # is the first thing to look at when a document test fails. `full` is
      # asserted rather than `full|partial` because `partial` now means
      # "resource limits and no file access, with something else missing": a
      # runner whose kernel lost Landlock would grade `none`, and by default
      # that host does not parse documents at all. A CI runner silently
      # dropping to a weaker grade is the thing this step exists to catch, so
      # it must not be accepted by the assertion.
      - name: Report the document extraction sandbox
        run: |
          cargo build --bin nanofile
          ./target/debug/nanofile extract-worker --selftest |
            tee /tmp/sandbox.txt
          grep -q 'profile=documents' /tmp/sandbox.txt
          grep -q 'level=full' /tmp/sandbox.txt
          grep -q 'files=denied' /tmp/sandbox.txt
          grep -q 'network=denied' /tmp/sandbox.txt
          grep -q 'process=denied' /tmp/sandbox.txt
          grep -q 'parse=pdf-ok,docx-ok' /tmp/sandbox.txt
          # The calls Landlock cannot govern are this filter's job, and a kernel
          # without seccomp is the one case where they are not covered.
          grep -q 'll_gaps=closed' /tmp/sandbox.txt
          grep -q 'dumpable=off' /tmp/sandbox.txt
          # Memory that is writable is not executable. `off` is what a kernel
          # older than 6.3 answers, which is a fact about the runner.
          grep -qE 'mdwe=(on|off)' /tmp/sandbox.txt
          grep -qE 'seccomp=[0-9]+' /tmp/sandbox.txt

      # The media profile is the one that may execute a helper. This runner has
      # ffmpeg installed (the step above the suite), so the probe runs it under
      # the profile, prints what the grants installed, and reads a document's
      # worth of proof that the confined helper still starts.
      #
      # The last two assertions are the narrowing this profile needed: `exec` is
      # granted to the helper and its interpreter, never to a directory, so the
      # child's own attempt to start `/bin/true` is refused by the files layer
      # (`exec=denied`) even though ffmpeg runs. `process=open` is the item that
      # follows from the profile's job: it starts a program, so it cannot claim
      # the process protection the document profile claims.
      - name: Report the media sandbox profile
        run: |
          ./target/debug/nanofile extract-worker \
            --selftest --profile media --ffmpeg "$(command -v ffmpeg)" |
            tee /tmp/media.txt
          grep -q 'profile=media' /tmp/media.txt
          grep -q 'level=partial' /tmp/media.txt
          grep -q 'files=denied' /tmp/media.txt
          grep -q 'process=open' /tmp/media.txt
          grep -q 'helper=allowed' /tmp/media.txt
          grep -q 'parse=media-ok' /tmp/media.txt
          grep -qE 'helper_grants=[1-9]' /tmp/media.txt
          grep -q 'exec=denied' /tmp/media.txt

      # The arm64 syscall table is not the x86_64 one: several of the calls the
      # filter names (the bare path-taking forms) do not exist there, and every
      # other job here builds x86_64. A tiny crate holding the real module is
      # enough to type-check the numbers the running kernel would be given.
      - name: Check the Linux sandbox for aarch64
        run: |
          rustup target add aarch64-unknown-linux-gnu
          mkdir -p /tmp/acheck/src/sandbox
          cp server/src/sandbox/linux.rs /tmp/acheck/src/sandbox/
          # The shebang reader the media grants call: the real file, not a copy
          # of its body, so the two cannot drift.
          cp server/src/sandbox/shebang.rs /tmp/acheck/src/sandbox/
          cat > /tmp/acheck/Cargo.toml <<'EOF'
          [package]
          name = "acheck"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          libc = "0.2"

          [workspace]
          EOF
          # A stand-in for the parent module: this check is about the syscall
          # numbers linux.rs names on arm64, so only what it reaches for is
          # stubbed, and the real linux.rs is what is compiled.
          cat > /tmp/acheck/src/sandbox/mod.rs <<'EOF'
          pub mod linux;

          #[path = "shebang.rs"]
          pub mod shebang;
          pub(crate) use shebang::interpreter as shebang_interpreter;

          use std::path::Path;

          #[derive(Default, Clone, Copy)]
          pub struct Protections {
              pub limits: bool,
              pub files: bool,
              pub network: bool,
              pub process: bool,
          }

          #[derive(Clone, Copy, PartialEq, Eq)]
          pub enum Profile {
              Documents,
              Images,
              Media,
          }

          impl Profile {
              pub fn runs_helper(self) -> bool {
                  matches!(self, Profile::Media)
              }
          }

          #[derive(Default, Clone, Copy)]
          pub struct Grants<'a> {
              pub helper: Option<&'a Path>,
              pub source: Option<&'a Path>,
          }

          pub struct Clamped {
              pub address_space: bool,
              pub detail: String,
          }

          impl Clamped {
              pub fn enforced(&self, memory: bool) -> bool {
                  memory || self.address_space
              }
          }

          pub fn clamp_resources() -> Clamped {
              Clamped {
                  address_space: true,
                  detail: String::new(),
              }
          }

          pub fn exercise() {
              let _ = linux::confine(Profile::Documents, Grants::default());
              let _ = linux::confine(Profile::Media, Grants::default());
          }
          EOF
          cat > /tmp/acheck/src/lib.rs <<'EOF'
          pub mod sandbox;
          EOF
          cd /tmp/acheck && CARGO_TARGET_DIR=/tmp/acheck/target \
            cargo check --target aarch64-unknown-linux-gnu

  # ── Tests (linux only, fastest) ─────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    # Debug info is most of what `rustc` writes and the linker has to move: this
    # job builds 74 integration-test binaries against the whole server crate,
    # and nothing here reads a symbol. A failing test still reports its own
    # `file:line`, because that comes from `panic!`'s location rather than from
    # debug info — only a `RUST_BACKTRACE` would be poorer. Note this is the
    # `debug` key, not `debug-assertions`: the suite still runs with
    # `debug_assert!` enabled. Set per job, so local profiles and the nightly
    # release build are untouched.
    #
    # What `Run tests` spends its 272s on, measured rather than assumed: ~110s
    # building those 74 binaries (~1.5s each, and `lld` does not shorten it),
    # ~25s the server crate and its dependencies, ~130s the 1916 tests. The
    # second and third are what splitting the targets across runners would cut;
    # this repository is public, so the minutes cost nothing.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"

      - name: Install Tailwind CSS
        run: npm ci

      # `thumbnail_sandbox_test` starts ffmpeg and skips itself when the host
      # has none, so keeping this installed is what keeps that coverage real
      # rather than merely green.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests
        run: cargo test --workspace -- --nocapture

