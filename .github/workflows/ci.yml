name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Detect which areas changed, so Rust jobs can be skipped on pure
  #    frontend/docs changes ────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'server/build.rs'
              - 'server/static/**'
              - 'server/templates/**'
              - 'server/frontend/**'
              # build.rs shells out to the pinned esbuild/tailwind versions, so
              # a dependency bump is a build change.
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'server/frontend/**'
              - 'server/static/**'
              - 'server/templates/**'
              - 'package.json'
              - 'package-lock.json'

  # ── Formatting + linting (single job to reuse checkout/toolchain) ────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install Tailwind CSS
        run: npm ci
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Comments must explain the invariant, not cite an external audit item
      # number: those references are meaningless to a reader who does not have
      # the report, and they go stale as soon as the code moves.
      - name: Reject dangling audit-item markers in comments
        run: |
          if grep -rnE '\b[CHML]-[0-9]+\b' \
              --include='*.rs' --include='*.toml' \
              base infra server migration config.toml.example \
            | grep -vE 'CRC-32|INC-'; then
            echo "::error::Replace audit-item markers with the invariant they refer to."
            exit 1
          fi

  # ── Optional tray feature (compiled out by default; keep it healthy) ──
  tray-check:
    name: Tray feature
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"
      - name: Install tray system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Install Tailwind CSS
        run: npm ci
      - name: Test with tray feature
        run: cargo test -p server --features tray --bin nanofile -- --nocapture

  # ── Frontend tests (pure JS, no npm deps) ──────────────────────────
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - run: node --test --experimental-test-coverage "server/frontend/**/*.test.js"

  # ── Playwright e2e (browser) ────────────────────────────────────────
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Install Tailwind CSS
        run: npm ci
      - name: Build nanofile binary
        run: cargo build --bin nanofile
      - name: Install e2e deps
        run: npm ci --prefix e2e
      - name: Install Playwright browsers
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run --prefix e2e test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: e2e-failure-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/server.log

  # ── Dependency advisories ───────────────────────────────────────────
  audit:
    name: Crate audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prebuilt binary: compiling cargo-audit on every run would cost minutes.
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities only; unmaintained/unsound crates are
      # reported as warnings. Unfixable advisories are listed with their
      # rationale in .cargo/audit.toml.
      - name: Check for known vulnerabilities
        run: cargo audit

  # ── Tests (linux only, fastest) ─────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "nanofile"

      - name: Install Tailwind CSS
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: cargo test --workspace -- --nocapture

