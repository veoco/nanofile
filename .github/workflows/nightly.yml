name: Nightly Build

# Actions are pinned to full commit SHAs (tag kept in a trailing comment) so a
# moved or hijacked tag cannot inject code into CI. Dependabot is deliberately
# not enabled on this repository: refresh a pin by resolving the new tag
# (`gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha`) and
# updating every occurrence.

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `actions/checkout` runs `git init`, which prints a hint about the initial
  # branch name when `init.defaultBranch` is unset. Setting it silences the
  # hint in every job; `main` is this repository's default branch.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # ── Check if there are new commits today ──────────────────────────
  check-new-commits:
    runs-on: ubuntu-latest
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Check if latest commit is from today
        id: check
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COMMIT_DATE=$(git log -1 --format='%cd' --date='format:%Y-%m-%d' 2>/dev/null)
          TODAY=$(date +%Y-%m-%d)
          if [[ "$COMMIT_DATE" == "$TODAY" ]]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build on every platform ────────────────────────────────────────
  build:
    name: ${{ matrix.asset_suffix }}
    needs: check-new-commits
    if: needs.check-new-commits.outputs.has_new == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            asset_suffix: linux-amd64
            tw_name: linux-x64
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            asset_suffix: linux-amd64-musl
            tw_name: linux-x64
            cross: true
          # Linux ARM64 / AArch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            asset_suffix: linux-arm64
            tw_name: linux-x64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ""
            asset_suffix: linux-arm64-musl
            tw_name: linux-x64
            cross: true
          # Linux LoongArch64
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
            ext: ""
            asset_suffix: linux-loong64
            tw_name: linux-x64
            cross: true
          - os: ubuntu-latest
            target: loongarch64-unknown-linux-musl
            ext: ""
            asset_suffix: linux-loong64-musl
            tw_name: linux-x64
            cross: true
          # macOS
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            asset_suffix: macos-arm64
            tw_name: macos-arm64
            cross: false
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset_suffix: windows-amd64
            tw_name: windows-x64.exe
            cross: false
          # ── Tray builds (--features tray) ────────────────────────────────
          # Tray variants ship for the native runner platforms only; the
          # musl/ARM/LoongArch rows build the headless binary.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            asset_suffix: linux-amd64-tray
            tw_name: linux-x64
            cross: false
            features: tray
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            asset_suffix: macos-arm64-tray
            tw_name: macos-arm64
            cross: false
            features: tray
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset_suffix: windows-amd64-tray
            tw_name: windows-x64.exe
            cross: false
            features: tray

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (cross-compilation)
        if: matrix.cross
        run: |
          curl -sL --retry 3 --retry-delay 2 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            -o /tmp/zig.tar.xz
          # zig 0.16.0 is the current release and is what the pinned
          # cargo-zigbuild (0.24.1, installed below) supports. Note that zig
          # 0.15+ raises the baseline of the binaries it emits to glibc 2.31 /
          # Linux 5.10 (0.14 emitted glibc 2.28 / Linux 4.19); add a suffix such
          # as `--target aarch64-unknown-linux-gnu.2.28` if older hosts must keep
          # working.
          # Pin the archive to its published SHA-256 so a compromised CDN or a
          # silently replaced tarball cannot inject a toolchain into the build.
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          tar xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH

      - name: Install Tailwind CSS
        run: npm ci

      # crates.io with retries instead of the release CDN: the latter has
      # answered 504 often enough to fail a cross row. 0.24.1 drops rustc
      # 1.100's `-Wl,--no-rosegment` for LoongArch, which `zig cc` rejects.
      - name: Install cargo-zigbuild
        if: matrix.cross
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo install cargo-zigbuild --version 0.24.1 --force; then
              break
            fi
            echo "cargo install failed (attempt $attempt); retrying"
            sleep 10
          done
          cargo-zigbuild --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: >-
          ${{ matrix.cross && 'cargo zigbuild' || 'cargo build' }}
          --release
          ${{ matrix.cross && format('--target {0}', matrix.target) || '' }}
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nanofile-${{ github.sha }}-${{ matrix.asset_suffix }}
          path: ${{ matrix.cross && format('target/{0}/release/nanofile{1}', matrix.target, matrix.ext) || format('target/release/nanofile{0}', matrix.ext) }}
          retention-days: 7

      # The release profile is what ships (LTO, stripped, `debug_assert!` off),
      # and this is the only job that runs the sandbox of an artifact rather than
      # of a test binary. The media profile is not probed: this runner has no
      # ffmpeg, and a probe without a helper would measure nothing.
      - name: Smoke-test the artifact's own sandbox
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          BIN="target/release/nanofile${{ matrix.ext }}"
          "$BIN" extract-worker --probe | tee probe.txt
          # `limits=on` is the hard invariant; `level=` left the probe line in
          # `d1ec10d`, so a grep for it only ever waits for a failure.
          grep -q 'limits=on' probe.txt
          grep -q 'parse=pdf-ok,docx-ok,xlsx-ok,pptx-ok' probe.txt
          "$BIN" extract-worker --probe --profile images | tee images.txt
          grep -q 'parse=image-ok(' images.txt
          # The model profiles have their own probes: these are the only places a
          # release build runs the detector and the OCR graphs.
          "$BIN" extract-worker --probe --profile faces | tee faces.txt
          grep -q 'parse=faces-ok(0)' faces.txt
          "$BIN" extract-worker --probe --profile ocr | tee ocr.txt
          grep -q 'parse=ocr-ok(0)' ocr.txt

  # ── Dev Docker image (multi-arch from pre-built binaries) ─────────
  docker-dev:
    name: Docker (dev)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download linux binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: nanofile-${{ github.sha }}-linux-*
          path: artifacts

      - name: Prepare binaries for multi-arch Docker build
        run: |
          mkdir -p docker-context
          platforms=""
          for dir in artifacts/nanofile-*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            # Use musl binaries — they're statically linked, suitable for scratch
            case "$name" in
              *-musl)
                base="${name%-musl}"
                arch="${base##*-}"
                case "$arch" in
                  amd64)   docker_arch="amd64";   plat="linux/amd64" ;;
                  arm64)   docker_arch="arm64";   plat="linux/arm64" ;;
                  loong64) docker_arch="loong64"; plat="linux/loong64" ;;
                  *) continue ;;
                esac
                ;;
              *) continue ;;
            esac
            if [ -f "$dir/nanofile" ]; then
              chmod +x "$dir/nanofile"
              cp "$dir/nanofile" "docker-context/nanofile-linux-${docker_arch}"
              platforms="${platforms},${plat}"
            fi
          done
          platforms="${platforms#,}"
          echo "DOCKER_PLATFORMS=$platforms" >> $GITHUB_ENV
          echo "Platforms: $platforms"
          ls -la docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker-context
          file: Dockerfile.ci
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          annotations: |
            org.opencontainers.image.description=nanofile - A Rust-based Seafile-compatible server
          push: true

      # The image is `FROM scratch` with a musl binary and no shell, no `/tmp`
      # and no `/etc/passwd`: nothing else in this repository runs the sandbox in
      # that environment. `extract-worker` returns before it loads a config, so
      # this needs neither a mounted data directory nor a config file.
      - name: Smoke-test the image's own sandbox
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          docker run --rm "$IMAGE" extract-worker --probe | tee /tmp/probe.txt
          # `limits=on` is the hard invariant; `level=` left the probe line in
          # `d1ec10d`, so a grep for it only ever waits for a failure.
          grep -q 'limits=on' /tmp/probe.txt
          grep -q 'parse=pdf-ok,docx-ok,xlsx-ok,pptx-ok' /tmp/probe.txt
          # The model profiles run the detector and OCR; this image is the only
          # musl/release environment the sandbox is measured in.
          docker run --rm "$IMAGE" extract-worker --probe --profile faces | tee /tmp/faces.txt
          grep -q 'parse=faces-ok(0)' /tmp/faces.txt
          docker run --rm "$IMAGE" extract-worker --probe --profile ocr | tee /tmp/ocr.txt
          grep -q 'parse=ocr-ok(0)' /tmp/ocr.txt
