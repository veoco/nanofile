[workspace]
resolver = "2"
members = [
    "base",
    "infra",
    "inference",
    "server",
    "migration",
]

# Versions and features every member must agree on: two manifests declaring
# `sha2` or `rand` separately is how the same crypto crate ends up in the graph
# at two versions. Feature-sensitive crates (`sea-orm`, `image`, `lettre`,
# `axum`, `resvg`, `lopdf`, `zip`, `argon2`, `tray-icon`) stay in their own
# manifest on purpose: cargo refuses a member's `default-features = false`
# unless the workspace entry already declares it, so a shared entry there would
# have to pick one member's needs over another's.

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aes = "0.9"
# `alloc` carries `cipher/alloc`, which the padded-vec block mode helpers in
# `infra::crypto` and `server::service::repo` need; `block-padding` is already
# `cbc`'s default. `cipher` itself is only reached through `aes::cipher`.
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
hex = "0.4"
pbkdf2 = { version = "0.13", features = ["hmac"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
thiserror = "2"
# The features the workspace actually uses. `full` also compiles `process`,
# `io-std` and tokio's own `parking_lot` shim, none of which the server starts;
# dependencies add the features they need (axum/hyper enable net/time) on top.
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Unused code is an error in every build, not only where `ci.yml` runs clippy:
# this is what reaches the targets with no runner and the release builds.
[workspace.lints.rust]
unused = "deny"
# The rest of rustc's warnings are denied here rather than by `-D warnings` on
# the command line, because the tray row lints and tests in one `clippy-driver`
# build (there is no `cargo nextest` flag that carries extra rustc arguments).
# Denying the group in the manifest is what keeps that row as strict as the
# separate clippy step it replaced: `clippy::all` covers clippy, this covers
# rustc's `deprecated`, naming and `private_interfaces` family.
#
# The two levels below are priority-annotated because Cargo ignores the order of
# this table: a lint set at the same priority as a group containing it does not
# override that group, and `clippy::lint_groups_priority` (implied by
# `clippy::all`) rejects the ambiguity.
warnings = { level = "deny", priority = -1 }
# The four cross builds link with zig, and linker output reaches rustc through
# this lint. Nothing here has ever denied it (`-D warnings` only ran on
# non-linking check builds), so the level stays where it was instead of turning
# a linker notice into a failed cross row. rustc 1.100 classifies the known
# benign notices as `linker_info`, which is allow-by-default anyway.
linker_messages = { level = "allow", priority = 1 }
# `unsafe` lives only in the platform/FFI modules whose file header carries
# `#![allow(unsafe_code)]`. A handler, service or repository that grows one
# stops compiling everywhere, including the targets with no clippy runner.
unsafe_code = "deny"

# Clippy's lints are denied the same way. The level reaches every build of a
# workspace member, and the four Linux cross builds are where it matters: clippy
# only runs there because `ci.yml` wraps them with clippy-driver. A plain rustc
# build ignores the group, so nothing else changes.
[workspace.lints.clippy]
all = "deny"

# Tests execute the embedded OCR/face models in-process, and with unoptimized
# kernels the OCR cases spent minutes of CPU per run (dozens of text-line
# recognition passes on the sample page alone). The hot code lives in the
# `inference` crate, so only it and its GEMM are optimized: `server` and the
# other dependencies keep the profile's default, which keeps a cold test build
# at minutes instead of ten. The debug binary (`cargo build`) and the release
# profiles are untouched.
[profile.test.package.inference]
opt-level = 2

[profile.test.package.matrixmultiply]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
