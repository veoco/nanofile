[package]
name = "migration"
version = "0.1.20"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# `default` enables sea-orm-migration's `cli` feature, which pulls the whole
# sea-orm-cli binary crate into the dependency graph. The server only needs the
# migrator; LTO already drops the unused code, so this is build-time hygiene
# rather than a size change.
sea-orm-migration = { version = "2", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
tokio = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
sea-orm = { version = "2", features = [
    "sqlx-sqlite",
    "runtime-tokio",
] }
tempfile = { workspace = true }
